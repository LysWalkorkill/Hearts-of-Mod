    YUG_continuer_grande_yougoslavie:0 "Continuer le projet Grande Yougoslavie"
    Hearts-of-Mod_YUG_industrie.1.title:0 "Progrès de la Grande Yougoslavie"
    Hearts-of-Mod_YUG_industrie.1.desc:0 "Le projet ambitieux de la « Grande Yougoslavie » continue de progresser à un rythme soutenu, et les autorités viennent d’annoncer qu’une nouvelle étape majeure a été atteinte dans son développement.\n\nMais au-delà des réalisations matérielles, c’est surtout l’engagement des travailleurs qui est mis en avant par les responsables du projet. Selon plusieurs témoignages, les ouvriers acceptent désormais de poursuivre leurs efforts même dans des conditions difficiles, n’hésitant pas à travailler sous la pluie pour respecter les délais.\n\nPlus marquant encore, certains auraient consenti à renoncer à des droits personnels, comme le congé paternité, au nom de l’intérêt national et de la réussite du projet.\n« On le fait pour le pays », confie un ouvrier. « C’est pas facile tous les jours, mais on sait pourquoi on est là. »"
    Hearts-of-Mod_YUG_industrie.1.a:0 "La Yougoslavie ne décevra pas..."
