    SAF_amenager_territoire:0 "Continuer d'aménager le territoire Sud-Africain"
    Hearts-of-Mod_SAF_amenagement.1.title:0 "Aménagement du territoire"
    Hearts-of-Mod_SAF_amenagement.1.desc:0 "Le gouvernement sud-africain poursuit activement ses projets d’aménagement du territoire, avec pour objectif de moderniser les infrastructures et de mieux exploiter les ressources naturelles du pays.\n\nCependant, cette expansion rapide suscite également des préoccupations. Certains experts et observateurs mettent en garde contre les conséquences écologiques à long terme, notamment la dégradation des sols, la disparition de certaines espèces et la perturbation des équilibres naturels.\n\nUn habitant de la région concernée partage son ressenti :\n« C’est sûr que ça apporte du travail pis du développement… mais on voit aussi la terre changer. Les paysages sont plus les mêmes, on se demande jusqu’où ça va aller. »"
    Hearts-of-Mod_SAF_amenagement.1.a:0 "Cet aménagement était nécessaire..."
