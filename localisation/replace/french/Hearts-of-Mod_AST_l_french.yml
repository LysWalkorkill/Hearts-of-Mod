    AST_securiser_timor_portugais:0 "Sécuriser le Timor Portugais"
    AST_securiser_papouasie:0 "Prendre le contrôle da la Papouasie"
    AST_securiser_iles_sonde:0 "Prendre le contrôle des îles de la Sonde"

    Hearts-of-Mod_AST_annexion.1.title:0 "Sécurisation des nouvelles terres"
    Hearts-of-Mod_AST_annexion.1.desc:0 "Dans un contexte de tensions croissantes dans la région du Pacifique, le gouvernement australien a ordonné la mobilisation de ses forces armées afin de prendre le contrôle d’une île jugée stratégique pour la sécurité maritime.\n\nLes premières informations indiquent que l’opération s’est déroulée sans affrontement majeur. La présence militaire a été établie rapidement, et des mesures sont déjà en place pour organiser la gestion du territoire sous contrôle australien.\n\nDes observateurs internationaux suivent de près cette manœuvre, qui pourrait avoir des répercussions sur l’équilibre géopolitique dans la région."
    Hearts-of-Mod_AST_annexion.1.a:0 "Ils nous remercierons quand le danger sera présent !"
