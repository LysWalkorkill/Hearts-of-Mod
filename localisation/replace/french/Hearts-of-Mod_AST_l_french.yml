    AST_legaliser_forrage_mecanique:0 "Légaliser le forrage mécanique"

    Hearts-of-Mod_AST_industrie.1.title:0 "Nouvelle législation"
    Hearts-of-Mod_AST_industrie.1.desc:0 "Le gouvernement australien à encore récemment annoncé une série de nouvelles mesures visant à accorder davantage de droits et de libertés aux chercheurs de pierres précieuses, un secteur en pleine expansion dans plusieurs régions du pays.\n\nSur le terrain, plusieurs prospecteurs accueillent la nouvelle avec enthousiasme. « Ça fait longtemps qu’on attend ça », confie l’un d’eux. « Y’a du potentiel partout, faut juste nous laisser travailler. »\n\nLes responsables politiques, de leur côté, insistent sur le fait que ces changements seront encadrés et progressifs. Ils affirment vouloir trouver un équilibre entre développement économique et gestion des ressources naturelles, tout en soutenant les travailleurs du secteur."
    Hearts-of-Mod_AST_industrie.1.a:0 "La Ruée vers l'or est Australienne !"
    
