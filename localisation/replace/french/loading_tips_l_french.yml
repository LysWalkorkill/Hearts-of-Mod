l_french:
 LOADING_TIP_0: "Les bases ne sont pas acquises.\n(kleerex)"
 LOADING_TIP_1: "La vérité pure et simple est très rarement pure et jamais simple.,\n(Oscar Wilde)"
 LOADING_TIP_2: "Chaque soldat doit savoir, avant qu'il aille au combat,\ncomment la bataille dans laquelle il va lutter\ns'inscrit dans une plus grande perspective.\n(Bernard Montgomery)"
 LOADING_TIP_3: "L'orgueil et l'abus de pouvoir sont des poisons qui détruisent les nations.\n(Albert-Ena Caron)"
 LOADING_TIP_4: "La tromperie et le mensonge sont le nerf de la guerre.\n(Néo le Grand)"
 LOADING_TIP_5: "Qui point ne risque, aux cimes ne parvient.\n(Naukovi)"
 LOADING_TIP_6: "Des temples Incas au Mexique ? Vraiment... \n(Zhanna) ."
 LOADING_TIP_7: "J'ai appris a lire et je ne le souhaite a personne.\n(Le Grand Hu)"
 LOADING_TIP_8: "Si y’a red air c’est mort.\n(Loutre)"
 LOADING_TIP_9: "Je me suis fait envahir l'Angleterre mais on a la Sicile...\n(Loutre)"
 LOADING_TIP_10: "Sarge tes recherche !!  ?\n(Tout Youtube)"
 LOADING_TIP_11: "Les flots de la guerre sont face a nous alors luttons.\n(inconnu français)"
 LOADING_TIP_12: "Paris outragé ! Paris brisé ! Paris martyrisé ! Mais Paris libéré !\n- Charles de Gaulle"
 LOADING_TIP_13: "Quand on tire on raconte pas sa vie.\n(Clint Eastwood)"
 LOADING_TIP_14: "Tu vois, le monde se divise en deux catégories,\n ceux qui ont un pistolet chargé et ceux qui creusent.\nToi, tu creuses.\n(Clint Eastwood)"
 LOADING_TIP_15: "Je ne mens pas, je dis des conneries\n(Jack Blues)"
 LOADING_TIP_16: "N'est stupide que la stupidité.\n(Forrest Gump)"
 LOADING_TIP_17: "Si jamais tu as des problèmes, ne joues pas les braves.\n Cours... Cours le plus vite possible!.\n(Jenny)"
 LOADING_TIP_18: "Ce que vous appelez l'enfer, il appelle ça chez lui.\n(Rambo 3)"
 LOADING_TIP_19: "John comment tu te sens ?\n - Bien cuit.\n(John Rambo)"
 LOADING_TIP_20: "Je vis dans un monde merdique, mais je suis vivant.\n(Full metal jacket)"
 LOADING_TIP_21: "Courage, Ed. Ce n'est pas un adieu.\n C'est juste que je ne te reverrai plus jamais...\n(Franck Drebin)"
 LOADING_TIP_22: "Si tu veux un conseil, oublie que t'as aucune chance.\n On sait jamais, sur un malentendu ça peut marcher.\n (Jean-Claude Dusse)"
 LOADING_TIP_23: "Le bonheur n'est réel que lorsqu'il est partagé.\n(Into the wild)"
 LOADING_TIP_24: "Le meilleur moyen de réaliser l'impossible est de croire que c'est possible.\n(Alice)"
 LOADING_TIP_25: "On rencontre souvent sa destinée\n par les chemins qu'on a pris pour l'éviter.!\n(Maître Shifu)"
 LOADING_TIP_26: "J'ai des mains faites pour l'or et elles sont dans la merde !\n(Scarface)"
 LOADING_TIP_27: "Ce que vous faites dans la vie résonne dans l'éternité.\n(Gladiator)"
 LOADING_TIP_28: "Si tu ne décides pas de ton destin\n c'est ton destin qui décide pour toi.\n(Tony Stark)"
 LOADING_TIP_29: "Le courage ce n'est pas l'absence de peur\n mais plutôt la conviction que la peur n'est pas le plus important.\n(Mia Thermopolis)"
 LOADING_TIP_30: "Est que j'ai l'air d'un homme marié ?\n La cuvette des chiottes est relevée, mec !.\n(Jeff Bridges)"
 LOADING_TIP_31: "Je réalise que j'aime ma maison quand je reviens d'ailleurs.\n(Juno)"
 LOADING_TIP_32: "Chauve et lâche, ça fait beaucoup pour un seul homme...\n(anonyme)"
 LOADING_TIP_33: "Y a pas d'hélice hélas.\n C'est là qu'est l'os !\n(La Grande Vadrouille)"
 LOADING_TIP_34: "La première règle du projet Chaos est :\n on ne pose pas de questions !\n(the Fight Club)"
 LOADING_TIP_35: "Il n'y a rien de plus coûteux pour un marchand d'armes que la paix.\n(Lord of war)"
 LOADING_TIP_36: "L'union fait la force ! La foi fait l'union !.\n(Vendetta)"
 LOADING_TIP_37: "Si tu ne peux pas dire un mot gentil,\n tu ne dis rien du tout !\n(Un lapin de dessin-animé)"
 LOADING_TIP_38: "Pas de violence, c'est les vacances !\n(Brice de nice)"
 LOADING_TIP_39: "Même des ennemis peuvent se respecter.\n(Troie)"
 LOADING_TIP_40: "Il n'y a pas de certitudes, il n'y a que des opportunités.\n(Vendetta)"
 LOADING_TIP_41: "Mais dis-donc, on n'est quand même pas venu pour beurrer des sandwichs !\n(Les tontons flingueurs)"
 LOADING_TIP_42: "Silence maraud, je parlemente.\n(Hubert de Montmirail)"
 LOADING_TIP_43: "La colère décuple ta puissance, mais si tu la laisses te dominer,\n elle va te détruire...\n(Bruce Wayne)"
 LOADING_TIP_44: "On n'évite pas la guerre, et la reporter profite à l'ennemi.\n(Revolver)"
 LOADING_TIP_45: "Je suis un homme d'affaire,\n et le sang ça coûte trop cher.\n(Le parrain)"
 LOADING_TIP_46: "Rien n'est plus fort que le coeur d'un volontaire.\n(Pearl Harbor)"
 LOADING_TIP_47: "La meilleure façon de s'assurer une défaite\n est d'abandonner.!\n(Morgan Freeman)"
 LOADING_TIP_48: "Si ce n'était pas dur, tout le monde le ferait.\n C'est le dur qui le rend génial\n(Tom Hanks)"
 LOADING_TIP_49: "Je sais que tu peux te battre,\n mais c'est ton esprit qui fait de toi un homme..\n(Mel Gibson)"
 LOADING_TIP_50: "Tu ne sais pas qui tu es,\n jusqu'à ce que tu perdes qui tu es.\n(Taylor Swift)"
 LOADING_TIP_51: "Il est possible de grimper au sommet\n sans piétiner les autres..\n(Taylor Swift)"
 LOADING_TIP_52: "Il n'y a rien de tel qu'un défi\n pour faire ressortir le meilleur chez l'homme..\n(Sean Connery)"
 LOADING_TIP_53: "Les vrais cow-boys sont ceux,\n  qui n'ont pas peur de se salir..\n(Lane Frost)"
 LOADING_TIP_54: "J'aimerais mieux être respecté qu'idolâtré.\n(Brad Pitt)"
 LOADING_TIP_55: "ça n'a pas marché ?\n Pas de soucis plan BIS...\n Sarge le chef)"
 LOADING_TIP_56: "Je viens d'en dézinguer un !\nDixon au porte-avions : je viens d'en dézinguer un !\n(Robert E. Dixon, bataille de la mer de Corail)"
 LOADING_TIP_57: "Les idées défendues par nos aînés\n méritent d’être rappelées à une jeunesse\n qui est un peu perdue aujourd'hui.\n(Angelina Jolie)"
 LOADING_TIP_58: "C’est en temps de guerre que le meilleur et le pire s’expriment..\n(Angelina Jolie)"
 LOADING_TIP_59: "C'est toujours l'impatience de gagner qui fait perdre.\n(Louis XIV)"
 LOADING_TIP_60: "On ne fait jamais rien d'extraordinaire, de grand et de beau,\n qu'en y pensant plus souvent et mieux que les autres.\n(Louis XIV)"
 LOADING_TIP_61: "Je sais, quand il le faut, quitter la peau du lion\n pour prendre celle du renard.\n(Napoléon Bonaparte)"
 LOADING_TIP_62: "La faute est dans les moyens bien plus dans les principes.\n(Napoléon Bonaparte)"
 LOADING_TIP_63: "Mieux vaut une tête bien faite que bien pleine.\n(Michel de Montaigne)"
 LOADING_TIP_64: "On peut s'arrêter quand on monte,\n jamais quand on descend.\n(Napoléon Bonaparte)"
 LOADING_TIP_65: "Je hais la prudence, elle ne vous amène à rien.\n(Jacques Brel)"
 LOADING_TIP_66: "Un homme passe sa vie, à compenser son enfance.\n(Jacques Brel)"
 LOADING_TIP_67: "Sans technique, un don n'est rien qu'une sale manie.\n(Georges Brassens)"
 LOADING_TIP_68: "Et gloire à ce soldat qui jeta son fusil,\nplutôt que d'achever l'otage à sa merci\n(Georges Brassens)"
 LOADING_TIP_69: "La créativité est le feu de mon âme.\n(Mozart)"
 LOADING_TIP_70: "Plus l'homme est bête et mieux son cheval le comprend.\n(Anton Tchekhov)"
 LOADING_TIP_71: "Malheureusement, dans les rapports entre les gens,\n seuls comptent les gains et les pertes.\n(Gao Xingjian)"
 LOADING_TIP_72: "On ne voit bien qu'avec le cœur.\n L'essentiel est invisible pour les yeux.\n(Antoine de Saint-Exupéry)"
 LOADING_TIP_73: "La solitude ne m'a jamais effrayé.\n Elle est même ma meilleure amie depuis toujours.\n(Johnny Hallyday)"
 LOADING_TIP_74: "Si on avait pas perdu une heure et quart,\n on serait là depuis une heure et quart.\n(Johnny Hallyday)"
 LOADING_TIP_75: "Apprendre une nouvelle langue, c'est avoir une nouvelle âme.\n(Charlemagne)"
 LOADING_TIP_76: "L’expérience, voilà le maître en toutes choses.\n(Jules César)"
 LOADING_TIP_77: " Attraaapez la dodue !!!!\n(Prince Jean)"
 LOADING_TIP_78: "Le courage n'est pas l'absence de peur,\n mais la capacité de vaincre ce qui fait peur.\n(Nelson Mandela)"
 LOADING_TIP_79: "Le courage, c’est de chercher la vérité et de la dire\n(Jean Jaurès)"
 LOADING_TIP_80: "Ne doutez jamais qu’un petit groupe d’individus motivés puisse changer le monde\n(Margaret Mead)"
 LOADING_TIP_81: "Aucun plan de bataille ne survit face à la réalité du terrain.\n(Fredéric M)"
 LOADING_TIP_82: "Chaque légionnaire est ton frère d'armes,\n  quelle que soit sa nationalité, sa race ou sa religion\n(Légion Étrangère)"
 LOADING_TIP_83: "La fraternité du malheur est la fraternité la plus rapide\n(José Marti)"
 LOADING_TIP_84: "Le pire de tous les despotismes, c'est le gouvernement militaire.\n(Robespierre)"
 LOADING_TIP_85: "Le soldat français ne recule que pour mieux sauter\n(Maréchal Lyautey)"
 LOADING_TIP_86: " La force naît par violence et meurt par liberté\n(Léonard de Vinci)"
 LOADING_TIP_87: "Ce qui est dur à l'entraînement,\n sera facile pendant la bataille\n(Alexandre Souvorov)"
 LOADING_TIP_88: "Moitier fin du mois, moitier fin du monde.\n(Alain Bauer)"
 LOADING_TIP_89: "Il y'a que dans l'ombre qu'on y voit clair.\n Bernard Blié)"
 LOADING_TIP_90: "traîtres, je l'ai ferrais fusiller.\n oui bah pour l'instant ce sont eux qui tirent...\n(Maria Rosa & Louis de Funès)"
 LOADING_TIP_91: "Il faut du courage pour affronter ses ennemis,\n mais il en faut encore plus pour affronter ses amis...\n(Albus Dumbledore)"
 LOADING_TIP_92: "J’ai tout appris dans les livres.\n Mais il y a des choses beaucoup plus importantes,\n le courage, l’amitié.\n(Hermione Granger)"
 LOADING_TIP_93: "Les bons soldats obéissent aux ordres\n(Capitaine Rex)"
 LOADING_TIP_94: "Un grand bond en avant nécessite souvent de reculer de deux pas\n(Obi Wan Kenobi)"
 LOADING_TIP_95: "Demain est la chose la plus importante de la vie.\n Il nous arrive à minuit encore tout propre.\n(John Wayne)"
 LOADING_TIP_96: "C'était pas mauvais, c'était très mauvais !\n(Louis de Funès)"
 LOADING_TIP_97: "Très jolie, Colonel, très jolie, mais savent-ils se battre ?\n(Pinkley)"
 LOADING_TIP_98: "Et souvenez-vous de ceci... Quand vous arriverez en Normandie,\n vous n'aurez qu'un seul ami - Dieu\n(James M. Gavin)"
 LOADING_TIP_99: "L'invasion a commencé en Normandie.\n Nous devons voler là-bas et attaquer avec nos deux avions\n(Josef Priller)"
 LOADING_TIP_100: "Croyez-moi, messieurs, les premières 24 heures de l'invasion seront décisives.\n Pour les Alliés comme pour les Allemands,\n ce sera la journée la plus longue... Le jour le plus long.\n(Erwin Rommel)"
 LOADING_TIP_101: "cette fois, vous allez vous battre sur le sol français,\n  dans nos champs, dans nos villages, sous les yeux de notre propre peuple\n(Philippe Kieffer)"
 LOADING_TIP_102: "Nous sommes en train de nous faire assassiner ici !\n  Autant aller à l'intérieur des terres et être assassinés !\n(colonel Thompson)"
 LOADING_TIP_103: "Je n'ai pas tiré avec mon arme toute la journée. J'entends toujours des coups de feu,\n mais à chaque fois que j'y arrive, tout le monde est parti !\n(Dutch Schultz)"
 LOADING_TIP_104: "ce qu'il nous faut, c'est des héros...\n T'en connais toi des héros dans le coin ? (Nikita Khrouchtchev)"
 LOADING_TIP_105: "L'aristocrate de Bavière chassant le cerf\n  contre le petit berger de l'Oural braconnant le loup.\n  C'est plus qu'un duel entre deux hommes,\n  c'est le symbole de la lutte des classes.\n(Commissaire Danilov)"
 LOADING_TIP_106: "Nous n'avions pas encore de racines. La guerre,\n comme un fleuve, nous a emportés dans son courant.\n(Erich Maria Remarque)"
 LOADING_TIP_107: "Si nos enfants peuvent vivre en sécurité un jour de plus,\n cela vaudrait la peine de défendre cette île un jour de plus.\n(Tadamichi Kuribayashi)"
 LOADING_TIP_108: "On m'a déjà traité de tous les noms Colonel, mais jamais de solution.\n(Nous étions soldats)"
 LOADING_TIP_109: "Les idéaux sont pacifiques, l'histoire est violente.\n(Fury)"
 LOADING_TIP_110: "En vérité, le chemin importe peu, la volonté d'arriver suffit à tout.\n(Albert Camus)"
 LOADING_TIP_111: "Si on mettait autant d'énergie à s'aider qu'a ce détester,\n le monde irait drôlement mieux. (Sarge le chef)"
 LOADING_TIP_112: "J'ai pas encore Steam je vais aller l'acheter chez Micromania.\n(Ambre)"
 LOADING_TIP_113: "il peut venir, j'ai 1000 de hard,\n je lui souhaite bien du courage.\n(Emilie)"
 LOADING_TIP_114: "Le nombre de mauvais romans ne doit pas faire oublier la grandeur des meilleurs.\n(Albert Camus)"
 LOADING_TIP_115: "Je voudrais un pays communiste...\n(Event Sargiste 2023)"
 LOADING_TIP_116: "Est-ce que ce char ne manquait pas de radio 3 ?\n(Oilismine plateau télé-foot)"
 LOADING_TIP_117: "Pas folle la guêpe\n(Sowkorn)"
 LOADING_TIP_118: "Il a vraiment une tête à connaître le gout des feutres celui-la... \n(Liisa)"
 LOADING_TIP_119: "Ceux qui ont votés pour moi merci,\n les autres tant pis pour vous.\n(Marina Awards 2023)"
 LOADING_TIP_120: "Comment tu veux changer le monde,\n si on se lève tous les matins à 15h ?\n(Sarge le chef)"
 LOADING_TIP_121: "Et voila... Machu Picchu.\n(Internet)"
 LOADING_TIP_122: "C'est pas des citrons...\n C'est des citrons de Menton.\n(Shelly)"
 LOADING_TIP_123: "S'il y a un doute, c'est qu'il y a déjà pas de doute.\n(Chokgmx)"
 LOADING_TIP_124: "Advienne que pourra, s'il neige, on pellettera !\n(Proverbe du Québec)"
 LOADING_TIP_125: "Mieux vaut un crève-cœur momentané,\n qu'une erreur longue et sans remède\n(Proverbe Suisse)"
 LOADING_TIP_126: "La faiblesse de la force est de ne croire qu’à la force.\n(Paul Valéry)"
 LOADING_TIP_127: "Je vais débarquer en Italie avec mes divisions Ali-Bongo.\n(Herr Magniez)"
 LOADING_TIP_128: "Mérite le, mérite ce qu'on a tous fait pour toi.\n(Il faut sauver le Soldat Ryan)"
 LOADING_TIP_129: "La diplomatie sans les armes, c’est la musique sans les instruments.\n(Otto von Bismarck)"
 LOADING_TIP_130: "L'histoire de toute société jusqu'à nos jours,\n n'a été que l'histoire de luttes de classes.\n(Karl Marx)"
 LOADING_TIP_131: "Faire le bien ne peut pas rendre heureux,\n mais faire le mal rendra à coup sûr malheureux.\n(Léon Tolstoï)"
 LOADING_TIP_132: "Il n'y a pas d'autre amour que celui qui,\n consiste à donner sa vie pour ceux qu'on aime.\n(Léon Tolstoï)"
 LOADING_TIP_133: "Un homme sensé devrait trouver sa seule compagnie,\n suffisamment plaisante.\n(Emily Brontë)"
 LOADING_TIP_134: "Les personnes fières engendrent leurs propres peines.\n(Emily Brontë)"
 LOADING_TIP_135: "L'imagination est une qualité lorsqu'elle sert,\n mais un défaut si elle commande.\n(Agatha Christie)"
 LOADING_TIP_136: "La guerre paraît inconcevable jusqu’à ce qu’elle ait lieu.\n(Stéphane Audoin-Rouzeau)"
 LOADING_TIP_137: "Dans une guerre, c'est toujours l'adversaire qui commence.\n(Francis Blanche)"
 LOADING_TIP_138: "La guerre, c'est comme la chasse,\n sauf qu'à la guerre les lapins tirent.\n(Charles de Gaulle)"
 LOADING_TIP_139: "La paix est le temps où l’on dit des bêtises,\n la guerre le temps où on les paie.\n(Robert de Saint-Jean)"
 LOADING_TIP_140: "Ce ne sont pas ceux qui font le mal qui détruiront le monde, mais ceux qui n'agissent pas contre eux.\n(Albert Einstein)"
 LOADING_TIP_141: "Il n'existe pas d'exemple d'une nation qui aurait tiré profit d'une longue guerre.\n (Sun Tzu 1949)"
 LOADING_TIP_142: "La seule façon pour l'homme de gagner une guerre est de l'empêcher.\n(George Marshall)"
 LOADING_TIP_143: "Vous ne pouvez pas maîtriser votre avenir,\n si vous êtes toujours esclave de votre passé.\n(Rihanna)"
 LOADING_TIP_144: "Jamais un échec, toujours une leçon.\n(Rihanna)"
 LOADING_TIP_145: "La perception et la réalité sont deux choses différentes.\n(Tom Cruise)"
 LOADING_TIP_146: "J'aime mon métier autant que je le déteste.\n(Céline Dion)"
 LOADING_TIP_147: "À la guerre, c’est celui qui doute qui est perdu,\n on ne doit jamais douter.\n(Ferdinand Foch)"
 LOADING_TIP_148: "Il faut savoir perdre pour apprendre à gagner.\n(Louis II de Bourbon)"
 LOADING_TIP_149: "L’art de la guerre consiste à savoir choisir son moment.\n(Claude-Louis-Hector de Villars)"
 LOADING_TIP_150: "L’énergie est la première qualité du chef.\n(Charles Mangin)"
 LOADING_TIP_151: "Sarge ce soir y'a PMU ?\n(UOP35)"
 LOADING_TIP_152: "Mieux vaut être redouté ou haï que ridicule\n (proverbe de la Confédération suisse)"
 LOADING_TIP_153: "Le plus grand risque est de ne prendre aucun risque...\n Dans un monde qui évolue très rapidement, la seule stratégie qui échoue,\n est de ne pas prendre de risques.\n (Mark Zuckerberg)"
 LOADING_TIP_154: "Quiconque sauve une vie sauve le monde entier.\n(Steven Spielberg)"
 LOADING_TIP_155: "On ne peut avoir 500 millions d'amis sans se faire quelques ennemis.\n(Mark Zuckerberg)"
 LOADING_TIP_156: "Un ordinateur en sécurité est un ordinateur éteint. Et encore...\n(Bill Gates)"
 LOADING_TIP_157: "Si vous ne pouvez pas faire les choses bien,\n faites au moins en sorte qu'elles aient l'air bien.\n(Bill Gates)"
 LOADING_TIP_158: "C'est pas parce qu'ils sont nombreux à avoir tort,\n qu'ils ont raison...\n(Coluche)"
 LOADING_TIP_159: "écrire 162 citations pour le mod c'était long...\n mais je vous souhaite un bon jeu !\n(Sarge le chef)"
 LOADING_TIP_160: "Dans les ténèbres, l'imagination travaille plus activement,\n qu'en pleine lumière.\n(Emmanuel Kant)"
 LOADING_TIP_161: "La nature agit, l'homme fait.\n(Emmanuel Kant)"
 LOADING_TIP_162: "Moi, je n'ai rien demandé !\n Je voulais juste être chauffeur livreur.\n(Zinedine Zidane)"
