l_french:
 #### Armor modele decisions
 armor_modele_decision_category: "Modèles de blindés prédéfinis"
 armor_modele_decision_category_desc: "'Foudroyés aujourd'hui par la force mécanique, nous pourrons vaincre dans l'avenir par une force mécanique supérieure. Le destin du monde est là.'\n\nGénéral Charles de Gaulle"
 tank_modele_conversion_de_char_lourd: "Conversion de Char Lourd"
 tank_modele_conversion_de_char_lourd_desc: "'Le char est une machine destinée à briser l’impasse.'\nRéflexion de la Première Guerre mondiale"
 tank_modele_char_lourd_1939: "Char Lourd 1939"
 tank_modele_char_lourd_1939_desc: "'Nous nous souvenons des champs où nos chars ont tenu la ligne.'\nSabaton"
 tank_modele_char_lourd_1941: "Char Lourd 1941"
 tank_modele_char_lourd_1941_desc: "'Le char est plus qu’une machine de guerre ; c’est un symbole de puissance industrielle.'\nAnalyse historique moderne"
 tank_modele_char_reco_1939: "Char Reco 1939"
 tank_modele_char_reco_1939_desc: "'Poussiéreux sont les visages, mais joyeux sont nos esprits… Notre char rugit là-bas.'\nKurt Wiehle"
 tank_modele_char_reco_final: "Char Reco Final"
 tank_modele_char_reco_final_desc: "'Si les chars réussissent, alors la victoire suit.'\nHeinz Guderian"
 tank_modele_char_lance_flamme_1939: "Char Lance-Flamme 1939"
 tank_modele_char_lance_flamme_1939_desc: "'Le feu tue, mais il éclaire aussi le champ de guerre.'\nFoch"
 tank_modele_char_lance_flamme_final: "Char Lance-Flamme final"
 tank_modele_char_lance_flamme_final_desc: "'Le feu est le premier maître de la bataille.'\nClausewitz"
 tank_modele_char_anti_air: "Char Anti-Air"
 tank_modele_char_anti_air_desc: "'Le tir antiaérien n’est pas fait pour tuer ; il est fait pour perturber.'\nManuel de l’US Army"
 tank_modele_char_moyen_1939_spg: "Char Moyen 1939 SPG"
 tank_modele_char_moyen_1939_spg_desc: "'Le véhicule blindé est à la fois un bouclier et une épée.'\nAnalyse historique sur les blindés"
 tank_modele_char_moyen_final_spg: "Char Moyen Final SPG"
 tank_modele_char_moyen_final_spg_desc: "'Ceux qui annoncent la fin du char sont prématurés.'\nDavid Axe"
 tank_modele_char_moyen_final_polyvalent: "Char Moyen Final (Polyvalent)"
 tank_modele_char_moyen_final_polyvalent_desc: "'Avec quelques ajustements, les chars… peuvent et doivent continuer à jouer un rôle central dans le combat terrestre.'\nDavid Axe"
