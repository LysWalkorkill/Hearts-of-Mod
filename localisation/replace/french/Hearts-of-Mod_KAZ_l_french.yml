  #focus
  
  KAZ_grande_industrialisation:0 "Grande industrialisation"
  KAZ_grande_industrialisation_desc:0 "L'Union soviétique a investi énormément pour développer notre industrie. Nous devons rentabiliser ses efforts."
  KAZ_rapide_industrialisation:0 "Industrialisation rapide"
  KAZ_rapide_industrialisation_desc:0 "Nous allons investir massivement dans l'industrialisation de notre pays."
  KAZ_grande_extension:0 "Grande expansion"
  KAZ_grande_extension_desc:0 "Grâce aux investissements précédents, nous allons faire sortir de terre des milliers d'habitations et ainsi augmenter notre capacité de construction."
  KAZ_exploiter_les_ressources_naturel:0 "Exploiter les ressources naturelles"
  KAZ_exploiter_les_ressources_naturel_desc:0 "Grâce aux ressources naturelles de notre territoire, nous allons pouvoir augmenter la capacité de nos industries."
  KAZ_societe_agriere:0 "Société agraire"
  KAZ_societe_agriere_desc:0 "Nous n'allons pas nous laisser influencer par l'Union soviétique et son désir de surindustrialiser notre pays."
  KAZ_renover_nos_plaines:0 "Rénover nos plaines"
  KAZ_renover_nos_plaines_desc:0 "Nous allons exploiter les richesses de notre patrie et en tirer des avantages."
  KAZ_demander_le_rapatriment_de_nos_troupeaux:0 "Demander le rapatriement de nos troupeaux"
  KAZ_demander_le_rapatriment_de_nos_troupeaux_desc:0 "Grâce aux troupeaux que l'Union soviétique nous avait pris auparavant, nous allons pouvoir restaurer la puissance de notre société agraire."
  KAZ_alocation_d_urgence:0 "Allocation d'urgence"
  KAZ_alocation_d_urgence_desc:0 "Face à la déstabilisation mondiale, l'Union soviétique nous a alloué un budget d'urgence pour nous permettre de nous préparer à l'avenir."
  KAZ_notre_politique_dechange:0 "Notre politique d'échange"
  KAZ_notre_politique_dechange_desc:0 "Nous allons nous imposer sur le marché international afin de profiter du libre-échange au bénéfice de notre industrie."
  KAZ_reveiller_les_industrielle:0 "Réveiller les industriels"
  KAZ_reveiller_les_industrielle_desc:0 "Grâce aux quelques puissants industriels présents sur notre territoire, nous allons établir de nouvelles usines de production."
  KAZ_Develloper_nos_villes:0 "Développer nos villes"
  KAZ_Develloper_nos_villes_desc:0 "Avec l'industrialisation de notre pays, il est temps de développer nos villes pour qu'elles soient à la hauteur de leur réputation."
  KAZ_reponse_a_la_destabilisation_mondial:0 "Réponse à la déstabilisation mondiale"
  KAZ_reponse_a_la_destabilisation_mondial_desc:0 "Nous devons investir massivement dans les usines d'armement afin de pouvoir défendre l'intégrité de notre territoire."
  KAZ_recherche_kazak:0 "Recherche kazakhe"
  KAZ_recherche_kazak_desc:0 "Nos intellectuels vont pouvoir s'investir davantage grâce à de nouveaux bâtiments fraîchement construits."
  KAZ_finir_les_routes_de_ravitaillement:0 "Achever les routes de ravitaillement"
  KAZ_finir_les_routes_de_ravitaillement_desc:0 "Compte tenu des conditions climatiques difficiles de notre territoire, nous devons investir dans des infrastructures dignes de ce nom."
  KAZ_ouvrir_des_usine_de_metalurgie_specialise:0 "Ouvrir des usines de métallurgie spécialisées"
  KAZ_ouvrir_des_usine_de_metalurgie_specialise_desc:0 "Après l'industrialisation rapide qu'a connue notre pays, nous avons besoin de davantage d'industries lourdes."
  KAZ_Remplir_nos_quotas:0 "Remplir nos quotas"
  KAZ_Remplir_nos_quotas_desc:0 "L'Union soviétique nous demande de plus en plus de ressources pour son industrie, et nous allons répondre à ses exigences."
  KAZ_Ouvrir_de_nouvelle_usine_de_metalurgie:0 "Ouvrir de nouvelles usines de métallurgie"
  KAZ_Ouvrir_de_nouvelle_usine_de_metalurgie_desc:0 "Grâce à de nouvelles usines de métallurgie, la production de ressources raffinées deviendra l'un des piliers de notre économie."
  KAZ_exploiter_le_bassin_karaganda:0 "Exploiter le bassin de Karaganda"
  KAZ_exploiter_le_bassin_karaganda_desc:0 "Le bassin de Karaganda est riche en charbon. C'est pourquoi nous devons investir dans cette ressource primordiale."
  KAZ_Satisfaire_les_demandes_en_matiere_premiere:0 "Satisfaire les demandes en matières premières"
  KAZ_Satisfaire_les_demandes_en_matiere_premiere_desc:0 "Notre industrie étant de plus en plus gourmande en ressources, nous devons creuser toujours davantage pour satisfaire cette demande."
  KAZ_installer_notre_industrie_sur_les_mines_dalu_russe:0 "Installer notre industrie sur les mines d'aluminium russes"
  KAZ_installer_notre_industrie_sur_les_mines_dalu_russe_desc:0 "Pour permettre à notre industrie aéronautique de subsister, il est nécessaire d'exploiter certaines ressources en Russie, moyennant bien sûr un prix."
  KAZ_faire_sortir_du_sol_les_mines_duranium:0 "Faire sortir du sol les mines d'uranium"
  KAZ_faire_sortir_du_sol_les_mines_duranium_desc:0 "Le sol kazakh est riche en uranium. Nous devons en profiter pour mener à bien certains projets."
  KAZ_investir_dans_des_nouveaux_chemin_de_fer:0 "Investir dans de nouvelles lignes ferroviaires"
  KAZ_investir_dans_des_nouveaux_chemin_de_fer_desc:0 "Notre réseau ferré est peu développé. Nous devons donc investir dans son amélioration."
  KAZ_se_preparer_a_lavenir:0 "Se préparer à l'avenir"
  KAZ_se_preparer_a_lavenir_desc:0 "Compte tenu de la situation mondiale, il est temps d'investir dans une véritable armée."
  KAZ_concentrer_nos_effort_sur_la_terre:0 "Concentrer nos efforts sur la terre"
  KAZ_concentrer_nos_effort_sur_la_terre_desc:0 "La guerre terrestre reste le principal enjeu de toute invasion malgré les progrès récents. C'est dans cette optique que nous devons investir dans une armée terrestre efficace."
  KAZ_rendre_le_service_de_quatre_ans_obligatoire:0 "Rendre le service de quatre ans obligatoire"
  KAZ_rendre_le_service_de_quatre_ans_obligatoire_desc:0 "Compte tenu de notre population actuelle, nous avons besoin d'un service militaire suffisamment long pour répondre aux besoins de notre armée."
  KAZ_la_qualite_sur_la_quantite:0 "La qualité plutôt que la quantité"
  KAZ_la_qualite_sur_la_quantite_desc:0 "Pour résister à une armée bien équipée, nous devons veiller à ce que nos troupes soient encore mieux équipées que celles de l'ennemi."
  KAZ_demander_la_license_de_okmo:0 "Demander la licence d'OKMO"
  KAZ_demander_la_license_de_okmo_desc:0 "Nous ne possédons aucune entreprise de construction de chars dans notre pays. C'est pourquoi nous demandons l'accès à une licence d'OKMO."
  KAZ_specialise_nos_usines:0 "Spécialiser nos usines"
  KAZ_specialise_nos_usines_desc:0 "Pour permettre à notre pays de construire une armée efficace, nous allons privilégier une armée mécanisée plutôt qu'une armée entièrement à pied."
  KAZ_ameliorer_le_caburant_des_chars:0 "Améliorer le carburant des chars"
  KAZ_ameliorer_le_caburant_des_chars_desc:0 "En améliorant la fluidité du carburant, nous optimiserons le mélange air-carburant."
  KAZ_reduire_la_surchauffe_des_mitrailleuse:0 "Réduire la surchauffe des mitrailleuses"
  KAZ_reduire_la_surchauffe_des_mitrailleuse_desc:0 "Pour permettre à nos mitrailleuses de char de tirer plus longtemps, nous allons changer de fournisseur de matières premières."
  KAZ_refaire_la_conception:0 "Revoir la conception"
  KAZ_refaire_la_conception_desc:0 "Grâce à une conception simplifiée, nos ingénieurs auront moins de difficultés à assembler nos blindés."
  KAZ_recruter_en_masse:0 "Recruter en masse"
  KAZ_recruter_en_masse_desc:0 "La tactique soviétique fondée sur la supériorité numérique nous permettra de faire plier nos ennemis sans grande difficulté."
  KAZ_effort_sur_les_anti_char:0 "Miser sur les armes antichars"
  KAZ_effort_sur_les_anti_char_desc:0 "Pour contrer les grandes nations ennemies, nous avons besoin d'excellentes armes antichars capables de stopper net leur progression."
  KAZ_arme_anti_blitz:0 "Armes anti-blitz"
  KAZ_arme_anti_blitz_desc:0 "Grâce à la production de masse d'armes antichars, nos combats contre les blindés ennemis deviendront plus faciles à soutenir."
  KAZ_offrir_un_bouclier_de_dca:0 "Offrir un bouclier de DCA"
  KAZ_offrir_un_bouclier_de_dca_desc:0 "Pour protéger nos camarades soviétiques, nous allons investir massivement dans la construction de défenses antiaériennes afin de neutraliser l'appui aérien rapproché ennemi."
  KAZ_avancer_nos_doctrine:0 "Faire progresser nos doctrines"
  KAZ_avancer_nos_doctrine_desc:0 "Nous devons moderniser nos doctrines, étant donné que nous ne disposons d'aucune expérience du combat."
  KAZ_la_PPSH_kazak:0 "La PPSh kazakhe"
  KAZ_la_PPSH_kazak_desc:0 "Grâce à une nouvelle arme de combat rapproché, nous serons plus efficaces sur le champ de bataille."
  KAZ_adopter_la_doctrine_sovietique:0 "Adopter la doctrine soviétique"
  KAZ_adopter_la_doctrine_sovietique_desc:0 "Nous allons faire venir plusieurs conseillers soviétiques pour améliorer l'entraînement de notre armée et la rendre plus efficace sur le terrain."
  KAZ_reorganiser_nos_etats_major:0 "Réorganiser nos états-majors"
  KAZ_reorganiser_nos_etats_major_desc:0 "Grâce à un état-major plus performant, nous pourrons réagir plus rapidement sur le front."
  KAZ_effort_sur_lartillerie:0 "Miser sur l'artillerie"
  KAZ_effort_sur_lartillerie_desc:0 "La puissance de feu repose également sur celle de notre artillerie. C'est dans cette optique que nous allons faire progresser certaines recherches dans ce domaine."
  KAZ_concentrer_nos_effort_sur_lair:0 "Concentrer nos efforts sur l'air"
  KAZ_concentrer_nos_effort_sur_lair_desc:0 "Notre doctrine aérienne est quasiment inexistante. C'est pourquoi nous allons tout créer de zéro afin de montrer au monde de quoi nous sommes capables."
  KAZ_devancer_nos_allier_le_plus_tot:0 "Devancer nos alliés le plus tôt possible"
  KAZ_devancer_nos_allier_le_plus_tot_desc:0 "Nous allons investir dans un centre de recherche aéronautique."
  KAZ_revoir_nos_composant_davionique:0 "Revoir nos composants avioniques"
  KAZ_revoir_nos_composant_davionique_desc:0 "Nous devons concevoir nos avions de zéro avec les moyens dont nous disposons."
  KAZ_innovation_aerienne:0 "Innovation aérienne"
  KAZ_innovation_aerienne_desc:0 "Grâce à des investissements adéquats, nous pourrons disposer de tout le nécessaire pour concevoir de bons avions."
  KAZ_recherche_sur_les_bombardier:0 "Recherches sur les bombardiers"
  KAZ_recherche_sur_les_bombardier_desc:0 "Les bombardements à longue distance sur les lignes ennemies peuvent constituer une stratégie intéressante."
  KAZ_creer_nos_doctrine_de_cas:0 "Créer notre doctrine d'appui aérien rapproché"
  KAZ_creer_nos_doctrine_de_cas_desc:0 "Au vu des événements survenus en Espagne, nous devons en tirer des enseignements pour notre propre armée."
  KAZ_entraine_nos_pilote_corectement:0 "Entraîner correctement nos pilotes"
  KAZ_entraine_nos_pilote_corectement_desc:0 "Avec des pilotes correctement entraînés, nous devrions pouvoir tenir tête à nos ennemis les plus coriaces."
  KAZ_allonger_la_distance_de_combat:0 "Allonger la distance de combat"
  KAZ_allonger_la_distance_de_combat_desc:0 "Avec l'extension de l'espace de combat aérien, nous devons nous adapter."
  KAZ_acheter_la_licence_de_Mikoyan_Gourevitch_mig:0 "Acheter la licence de Mikoyan-Gourevitch (MiG)"
  KAZ_acheter_la_licence_de_Mikoyan_Gourevitch_mig_desc:0 "Grâce à l'achat de la licence MiG, nous pouvons investir massivement dans le combat aérien sans avoir à nous soucier de la conception de nos appareils."
  KAZ_faire_profiter_mig_de_nos_nouvelle_technologie:0 "Faire profiter MiG de nos nouvelles technologies"
  KAZ_faire_profiter_mig_de_nos_nouvelle_technologie_desc:0 "Nous allons faire profiter MiG de nos récentes découvertes dans le domaine des radars aéroportés."
  KAZ_importer_un_nouveaux_type_de_bois:0 "Importer un nouveau type de bois"
  KAZ_importer_un_nouveaux_type_de_bois_desc:0 "Grâce à un bois plus léger et plus résistant, nos avions seront moins lourds."
  KAZ_revoir_nos_coupe_des_helices:0 "Revoir la forme de nos hélices"
  KAZ_revoir_nos_coupe_des_helices_desc:0 "Grâce à une nouvelle forme d'hélice, il est désormais plus facile de produire cette pièce essentielle."
  KAZ_SRR_kaz:0 "RSS kazakhe"
  KAZ_SRR_kaz_desc:0 "Notre suzerain nous a octroyé un statut particulier au sein de l'Union. Nous devons en profiter."
  KAZ_un_partenariat_avec_le_diable:0 "Un partenariat avec le diable"
  KAZ_un_partenariat_avec_le_diable_desc:0 "Il est clair que notre allié n'est pas le meilleur, mais nous devons garantir notre souveraineté mutuelle en toutes circonstances."
  KAZ_le_defenseur_de_nos_droit:0 "Le défenseur de nos droits"
  KAZ_le_defenseur_de_nos_droit_desc:0 "Avec un dirigeant politique qui œuvre pour le bien commun de nos paysans, tout devrait bien se passer."
  KAZ_instaurer_les_ecole_kazak:0 "Instaurer les écoles kazakhes"
  KAZ_instaurer_les_ecole_kazak_desc:0 "Grâce à des investissements constants, nous devrions pouvoir réduire l'illettrisme dans notre pays."
  KAZ_le_komintern:0 "Le Komintern"
  KAZ_le_komintern_desc:0 "La lutte de notre peuple ne doit pas se limiter à nos frontières : elle doit s'exporter pour le bien commun de l'humanité."
  KAZ_publier_la_propagande_sov:0 "Publier la propagande soviétique"
  KAZ_publier_la_propagande_sov_desc:0 "L'Union soviétique nous a récemment demandé de publier la propagande qu'elle diffuse sur son territoire. Nous devrions également la diffuser chez nous."
  KAZ_ouvrir_notre_propre_consul:0 "Ouvrir notre propre consulat"
  KAZ_ouvrir_notre_propre_consul_desc:0 "L'ouverture d'un consulat devrait permettre à nos industriels et aux autres acteurs économiques de mieux se coordonner sur notre territoire."
  KAZ_Aider_notre_partenaire_dans_sa_lutte:0 "Aider notre partenaire dans sa lutte"
  KAZ_Aider_notre_partenaire_dans_sa_lutte_desc:0 "Le général Hiver est un excellent allié, mais il s'en prend également à sa propre population et à d'autres victimes. C'est pourquoi nous pouvons partager notre savoir-faire sur l'ensemble du territoire soviétique."
  KAZ_Offrir_un_cadeaux_a_staline:0 "Offrir un cadeau à Staline"
  KAZ_Offrir_un_cadeaux_a_staline_desc:0 "Récemment, un berger nous a proposé une idée assez particulière : offrir une chèvre à Staline en signe d'amitié. Est-ce une bonne idée ?"
  KAZ_effectuer_un_investissement_mutuelle:0 "Effectuer un investissement mutuel"
  KAZ_effectuer_un_investissement_mutuelle_desc:0 "Nous allons nous coordonner avec l'Union soviétique afin de réaliser des investissements mutuellement avantageux le long de nos frontières."
  KAZ_faire_concurence_au_NKVD:0 "Faire concurrence au NKVD"
  KAZ_faire_concurence_au_NKVD_desc:0 "Nous allons ouvrir une agence de renseignement qui nous permettra de rivaliser avec le très célèbre NKVD."
  KAZ_publier_notre_constitution:0 "Publier notre constitution"
  KAZ_publier_notre_constitution_desc:0 "Il est temps de tourner la page et de publier notre constitution sur notre territoire."
  KAZ_demander_laccee_au_caoutchouc:0 "Demander l'accès au caoutchouc"
  KAZ_demander_laccee_au_caoutchouc_desc:0 "Avec l'essor de notre industrie aéronautique, nous devons trouver de nouvelles sources d'approvisionnement. Et quoi de mieux que Leningrad ?"
  KAZ_accepter_les_travailleurs_de_lextreme_orient:0 "Accepter les travailleurs de l'Extrême-Orient"
  KAZ_accepter_les_travailleurs_de_lextreme_orient_desc:0 "L'Union soviétique nous envoie des travailleurs de l'Extrême-Orient pour permettre à nos usines de fonctionner le plus longtemps possible."
  KAZ_faire_valoir_notre_droit_de_seconde_puissance_economique_sovietique:0 "Faire valoir notre statut de deuxième puissance économique soviétique"
  KAZ_faire_valoir_notre_droit_de_seconde_puissance_economique_sovietique_desc:0 "Il est temps d'annoncer au monde que nous ne sommes pas une simple république soviétique, mais bien une puissance économique majeure."
  KAZ_Rapatrier_notre_population:0 "Rapatrier notre population"
  KAZ_Rapatrier_notre_population_desc:0 "Nous avons reçu l'autorisation de l'Union soviétique de rapatrier notre population, dispersée aux quatre coins de son territoire."
  KAZ_affirmer_notre_alegeance:0 "Affirmer notre allégeance"
  KAZ_affirmer_notre_alegeance_desc:0 "Notre illustre dirigeant va se proclamer patriote socialiste après de longues années d'attente."
  KAZ_demander_le_retour_des_terres_de_nos_ancetre:0 "Demander le retour des terres de nos ancêtres"
  KAZ_demander_le_retour_des_terres_de_nos_ancetre_desc:0 "Depuis longtemps, nous souhaitons nous réunifier avec notre peuple, y compris au-delà de nos frontières actuelles."
  KAZ_abuser_de_leurs_confiance:0 "Abuser de leur confiance"
  KAZ_abuser_de_leurs_confiance_desc:0 "Grâce au rapatriement de notre population, nous pouvons enfin faire avancer nos véritables pions vers l'est."
  
  #event
  Hearts-of-Mod_KAZ.1.t: "[From.GetName] nous demande le retour de ses terres"
  Hearts-of-Mod_KAZ.1.title:0 "[From.GetName] nous demande le retour de ses terres"
  Hearts-of-Mod_KAZ.1.d: "[From.GetName] nous demande en bonne et due forme le rattachement de certains territoires revendiqués afin de réunifier sa population."
  Hearts-of-Mod_KAZ.1.a: "La coopération doit se poursuivre dans de bonnes conditions"
  Hearts-of-Mod_KAZ.1.b: "Ces terres resteront soviétiques"
  Hearts-of-Mod_KAZ.2.t: "[From.GetName] accepte notre proposition"
  Hearts-of-Mod_KAZ.2.title:0 "[From.GetName] accepte notre proposition"
  Hearts-of-Mod_KAZ.2.d: "Grâce à nos efforts de toutes ces années, nous sommes enfin réunis sous notre drapeau national."
  Hearts-of-Mod_KAZ.2.a: "Excellent"
  Hearts-of-Mod_KAZ.3.t: "[From.GetName] refuse notre proposition"
  Hearts-of-Mod_KAZ.3.title:0 "[From.GetName] refuse notre proposition"
  Hearts-of-Mod_KAZ.3.d: "C'est avec une grande honte que [From.GetName] refuse de nous transférer nos terres."
  Hearts-of-Mod_KAZ.3.a: "C'était pourtant dans leur intérêt"
  Hearts-of-Mod_KAZ.4.t: "[From.GetName] revendique le Tannou-Touva"
  Hearts-of-Mod_KAZ.4.title:0 "[From.GetName] revendique le Tannou-Touva"
  Hearts-of-Mod_KAZ.4.d: "[From.GetName] nous demande de lui transférer trois États situés à l'extrême est de notre territoire afin de se réunifier avec le Tannou-Touva."
  Hearts-of-Mod_KAZ.4.a: "Pourquoi pas"
  Hearts-of-Mod_KAZ.4.b: "On leur donne la main, ils prennent le bras"
  Hearts-of-Mod_KAZ.5.t: "[From.GetName] accepte"
  Hearts-of-Mod_KAZ.5.title:0 "[From.GetName] accepte"
  Hearts-of-Mod_KAZ.5.d: "Nous avons enfin réussi à réunir tous les territoires que nous revendiquions depuis tant d'années."
  Hearts-of-Mod_KAZ.5.a: "Merci"
  Hearts-of-Mod_KAZ.6.t: "[From.GetName] refuse"
  Hearts-of-Mod_KAZ.6.title:0 "[From.GetName] refuse"
  Hearts-of-Mod_KAZ.6.d: "C'est avec une grande honte que [From.GetName] refuse de nous transférer nos terres."
  Hearts-of-Mod_KAZ.6.a: "Dommage"
  Hearts-of-Mod_KAZ.7.t: "Le cadeau de Staline"
  Hearts-of-Mod_KAZ.7.title:0 "Le cadeau de Staline"
  Hearts-of-Mod_KAZ.7.d: "Dans un acte de bonté, un berger kazakh a offert une chèvre à Staline en personne, avec l'accord de son gouvernement. Depuis, la bête s'occupe de l'entretien des jardins personnels de Staline."
  Hearts-of-Mod_KAZ.7.a: "Je vais la nommer Maria"
  Hearts-of-Mod_KAZ.8.t: "[From.GetName] nous demande l'accès aux ressources stratégiques de Leningrad"
  Hearts-of-Mod_KAZ.8.title:0 "[From.GetName] nous demande l'accès aux ressources stratégiques de Leningrad"
  Hearts-of-Mod_KAZ.8.d: "[From.GetName] nous demande l'accès aux ressources stratégiques de Leningrad afin de devenir autonome dans la production locale de chasseurs."
  Hearts-of-Mod_KAZ.8.a: "Un mal pour un grand bien"
  Hearts-of-Mod_KAZ.8.b: "Jamais de la vie"
  Hearts-of-Mod_KAZ.9.t: "[From.GetName] accepte de nous céder le caoutchouc"
  Hearts-of-Mod_KAZ.9.title:0 "[From.GetName] accepte de nous céder le caoutchouc"
  Hearts-of-Mod_KAZ.9.d: "Afin de permettre une production aéronautique locale, [From.GetName] accepte de nous céder son caoutchouc."
  Hearts-of-Mod_KAZ.9.a: "Merci"
  Hearts-of-Mod_KAZ.10.t: "[From.GetName] refuse"
  Hearts-of-Mod_KAZ.10.title:0 "[From.GetName] refuse"
  Hearts-of-Mod_KAZ.10.d: "Malheureusement, nous n'aurons pas accès au caoutchouc russe."
  Hearts-of-Mod_KAZ.10.a: "Ma production..."
  Hearts-of-Mod_KAZ.11.t: "[From.GetName] demande l'accès aux mines d'aluminium"
  Hearts-of-Mod_KAZ.11.title:0 "[From.GetName] demande l'accès aux mines d'aluminium"
  Hearts-of-Mod_KAZ.11.d: "[From.GetName] accuse un retard considérable dans sa production aéronautique, en grande partie à cause du manque de ressources. Le pays nous demande donc l'accès à certaines de nos mines en échange de quelques usines."
  Hearts-of-Mod_KAZ.11.a: "Pour le bien de la patrie"
  Hearts-of-Mod_KAZ.11.b: "Et puis quoi encore ?"
  Hearts-of-Mod_KAZ.12.t: "[From.GetName] accepte"
  Hearts-of-Mod_KAZ.12.title:0 "[From.GetName] accepte"
  Hearts-of-Mod_KAZ.12.d: "Nous pouvons enfin accéder à l'aluminium, au prix de quelques sacrifices."
  Hearts-of-Mod_KAZ.12.a: "Bien"
  Hearts-of-Mod_KAZ.13.t: "[From.GetName] refuse de céder l'aluminium"
  Hearts-of-Mod_KAZ.13.title:0 "[From.GetName] refuse de céder l'aluminium"
  Hearts-of-Mod_KAZ.13.d: "Dans un acte de lâcheté, [From.GetName] refuse de nous laisser profiter des ressources de l'Oural."
  Hearts-of-Mod_KAZ.13.a: "C'est bien dommage"