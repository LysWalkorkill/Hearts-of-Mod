 VIC_ministeries_second_decision_3_desc: "Le ministère de la Guerre est responsable des affaires militaires de l’État et sera responsable du commandement et du contrôle de nos forces armées."
 VIC_ministeries_third: "Le ministère des Finances"
 VIC_ministeries_third_desc: "Le ministère des Finances est responsable des affaires financières de l'État et sera responsable de la collecte des impôts et de la gestion du budget de l'État."
 VIC_ministeries_third_decision_1: "Le ministère des Finances"
 VIC_ministeries_third_decision_1_desc: "Le ministère des Finances est responsable des affaires financières de l'État et sera responsable de la collecte des impôts et de la gestion du budget de l'État."
 VIC_ministeries_third_decision_2: "Le ministère des Finances"
 VIC_ministeries_third_decision_2_desc: "Le ministère des Finances est responsable des affaires financières de l'État et sera responsable de la collecte des impôts et de la gestion du budget de l'État."
 VIC_ministeries_third_decision_3: "Le ministère des Finances"
 VIC_ministeries_third_decision_3_desc: "Le ministère des Finances est responsable des affaires financières de l'État et sera responsable de la collecte des impôts et de la gestion du budget de l'État."
 VIC_complet_cabinet: "Armoire complète"
 VIC_complet_cabinet_desc: "Le cabinet est désormais au complet et le gouvernement est prêt à relever les défis qui l’attendent. Nous travaillerons sans relâche pour assurer la prospérité et la sécurité de notre nation et pour restaurer l’honneur et la dignité de la France."
 VIC_war_department: "Département de la guerre"
 VIC_war_department_desc: "Le ministère de la Guerre est responsable de la défense de la nation et sera responsable du commandement et du contrôle de nos forces armées. Il sera également responsable de l'administration militaire et travaillera en étroite collaboration avec le ministère de l'Intérieur pour assurer la sécurité de l'État."
 VIC_economical_department: "Département Economique"
 VIC_economical_department_desc: "Le Département économique est responsable des affaires économiques de l'État et sera responsable de la collecte des impôts et de la gestion du budget de l'État. Il sera également responsable de l'administration de l'économie et travaillera en étroite collaboration avec le ministère des Finances pour assurer la prospérité de la nation."
 VIC_axis_economic_domination: "Domination économique de l'Axe"
 VIC_axis_economic_domination_desc: "L'Allemagne nous aidera à construire une nation plus forte mais nous deviendrons leur Reichsprotectorat si la France tombait."
 VIC_axis_economic_domination_tt: "§YGermany§ ! nous aidera à construire une nation plus forte mais nous deviendrons leur §YReichsprotectorate§ ! si la France tombait"
 VIC_scrap_factories: "usines de ferraille"
 VIC_scrap_factories_desc: "Alors que la guerre fait rage, nous devons travailler chaque jour avec de moins en moins de ressources."
 VIC_spanish_investment: "investissement espagnol"
 VIC_spanish_investment_desc: "En investissant en Espagne, nous pouvons renforcer nos liens économiques et accéder à des ressources précieuses et à un soutien industriel."
 VIC_finish_investment: "terminer l'investissement"
 VIC_finish_investment_desc: "En investissant en Finlande, nous pouvons renforcer nos liens économiques et accéder à des ressources précieuses et à un soutien industriel."
 VIC_begin_reconstruction: "commencer la reconstruction"
 VIC_begin_reconstruction_desc: "Nous commencerons à reconstruire nos infrastructures et notre base industrielle détruites pour restaurer la force de la nation."
 VIC_the_great_investment: "le grand investissement"
 VIC_the_great_investment_desc: "Un investissement majeur dans notre économie qui générera des rendements significatifs et renforcera notre position sur le marché mondial."
 VIC_the_great_investment_tt: "pour chaque §Yétat possédant quatre§! ou plus §YInfrastructure§!, nous gagnerons §Yune usine civile supplémentaire§!"
 VIC_trad_bonus: "Bonus commercial"
 VIC_trad_bonus_desc: "Le bonus commercial nous fournira des ressources et des revenus supplémentaires, nous permettant d'investir dans notre économie et de renforcer notre position sur le marché mondial."
 VIC_sovereign_economy: "Économie souveraine"
 VIC_sovereign_economy_desc: "Une économie souveraine est une économie autosuffisante et indépendante, capable de résister aux pressions extérieures et de maintenir sa stabilité face aux fluctuations économiques mondiales."
 VIC_tungsten_mining: "Extraction de tungstène"
 VIC_tungsten_mining_desc: "Le tungstène est une ressource essentielle pour la production d’armes et de machines industrielles avancées. En investissant dans l’exploitation minière du tungstène, nous pouvons garantir un approvisionnement vital de ce matériau stratégique et améliorer nos capacités industrielles."
 VIC_europe_first_producer: "Premier producteur européen"
 VIC_europe_first_producer_desc: "En devenant le premier producteur européen de ressources clés et de biens industriels, nous pouvons établir une position dominante dans l'économie continentale et assurer notre prospérité à long terme."
 VIC_stable_economy: "Économie stable"
 VIC_stable_economy_desc: "Une économie stable est essentielle au bien-être de notre nation, car elle fournit une base solide pour la croissance, les investissements et la capacité de répondre efficacement aux défis nationaux et internationaux."
 VIC_call_for_vonlunters: "Appel à volontaires"
 VIC_call_for_vonlunters_desc: "De nombreux Français sont prêts à rejoindre notre cause contre notre gouvernement républicain corrompu. Nous les appellerons à nous rejoindre dans notre lutte pour une France nouvelle."
 VIC_la_grande_armee: "La Grande Armée"
 VIC_la_grande_armee_desc: "L’armée française a une longue et riche histoire, et nous nous efforcerons de restaurer sa force et son efficacité. En modernisant nos forces et en mettant en œuvre de nouvelles stratégies, nous veillerons à ce que la Grande Armée soit prête à défendre notre nation et à faire respecter nos valeurs."
 VIC_industrial_rebirth: "Renaissance industrielle"
 VIC_industrial_rebirth_desc: "Le secteur industriel de notre pays a beaucoup souffert sous le régime actuel. Nous investirons dans la revitalisation de nos industries, dans la promotion de l’innovation et dans la création d’emplois pour renforcer notre économie et améliorer la vie de nos citoyens."
 VIC_research_expansion: "Expansion de la recherche"
 VIC_research_expansion_desc: "Pour rester compétitifs dans le monde moderne, nous devons investir dans la recherche et le développement. En élargissant nos capacités de recherche, nous pouvons favoriser l’innovation, développer de nouvelles technologies et garantir que notre pays reste à l’avant-garde du progrès scientifique et industriel."
 VIC_research_expansion_2: "Expansion de la recherche II"
 VIC_research_expansion_2_desc: "L’expansion de nos capacités de recherche nous permettra d’explorer de nouvelles frontières scientifiques et technologiques, stimulant ainsi la croissance économique et renforçant notre sécurité nationale. Nous donnerons la priorité à la recherche dans des domaines clés pour maintenir notre avantage concurrentiel et assurer un avenir prospère à notre nation."
 VIC_research_expansion_3: "Expansion de la recherche III"
 VIC_research_expansion_3_desc: "En poursuivant nos efforts de recherche, nous repousserons les limites de la connaissance scientifique et de l’innovation technologique. Cela renforcera davantage nos capacités nationales et garantira notre prospérité à long terme."
 VIC_research_expansion_4: "Expansion de la recherche IV"
 VIC_research_expansion_4_desc: "By investing in cutting-edge research and fostering collaboration between our scientists and engineers, we will drive advancements that will benefit our economy, military, and society as a whole. Our commitment to research will secure our nation's place as a leader in the global arena 
 VIC_political_support: "Soutien politique"
 VIC_political_support_desc: "To achieve our goals, we must build a strong base of political support. By engaging with our citizens, promoting our vision, and fostering unity, we will ensure that our government has the mandate to implement the necessary reforms and policies for the betterment of our nation 
 VIC_Overseas_factory: "Usine à l'étranger"
 VIC_Overseas_factory_desc: "By establishing factories in our overseas territories, we can take advantage of local resources and labor, boosting our industrial output and creating economic opportunities in these regions. 
 VIC_ten_hours_shift: "Poste de dix heures"
 VIC_ten_hours_shift_desc: "By implementing a ten-hour work shift, we can increase productivity and efficiency in our factories, while also ensuring that our workers have a balanced work-life schedule. 
 VIC_twelve_hours_shift: "Quart de douze heures"
 VIC_twelve_hours_shift_desc: "En mettant en œuvre un quart de travail de douze heures, nous pouvons augmenter davantage notre production industrielle et répondre aux demandes croissantes de notre économie, tout en offrant à nos travailleurs une rémunération et des avantages équitables pour leurs heures prolongées."
 VIC_national_resurgency: "Résurrection nationale"
 VIC_national_resurgency_desc: "La nation française a été confrontée à de nombreux défis tout au long de son histoire, mais nous sommes engagés dans une résurgence nationale qui restaurera notre fierté, notre force et notre influence sur la scène mondiale. Grâce à l’unité, à la détermination et à la planification stratégique, nous surmonterons l’adversité et assurerons un avenir radieux à notre pays."
  ## END VICHY 
  
