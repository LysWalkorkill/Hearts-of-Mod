  ## VICHY 
 VIC_war_research_infantry: "Recherche de guerre - Infanterie"
 VIC_war_research_infantry_desc: "Les Allemands ont proposé de partager avec nous leurs connaissances en matière de tactiques et d’équipements d’infanterie, nous permettant ainsi d’améliorer nos propres capacités d’infanterie."
 VIC_war_research_armor: "Recherche de guerre - Armure"
 VIC_war_research_armor_desc: "Les Allemands ont proposé de partager avec nous leurs connaissances en matière de tactiques et d’équipements blindés, nous permettant ainsi d’améliorer nos propres capacités blindées."
 VIC_war_research_support: "Recherche sur la guerre - Assistance"
 VIC_war_research_support_desc: "Les Allemands ont proposé de partager avec nous leurs connaissances en matière de tactiques et d’équipements de soutien, nous permettant ainsi d’améliorer nos propres capacités de soutien."
 VIC_war_research_arty: "Recherche sur la guerre - Artillerie"
 VIC_war_research_arty_desc: "Les Allemands ont proposé de partager avec nous leurs connaissances en matière de tactiques et d’équipements d’artillerie, nous permettant ainsi d’améliorer nos propres capacités d’artillerie."
 VIC_war_research_elec: "Recherche sur la guerre – Électronique"
 VIC_war_research_elec_desc: "Les Allemands ont proposé de partager avec nous leurs connaissances en matière de tactiques et d’équipements de guerre électronique, nous permettant ainsi d’améliorer nos propres capacités électroniques."
 VIC_war_research_indus: "Recherche sur la guerre - Industrie"
 VIC_war_research_indus_desc: "Les Allemands ont proposé de partager avec nous leurs connaissances en matière de tactiques et d’équipements industriels, nous permettant ainsi d’améliorer nos propres capacités industrielles."
