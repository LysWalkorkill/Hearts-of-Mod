 VIC_contact_support: "Contacter l'assistance"
 VIC_contact_support_desc: "Le gouvernement de Vichy n'est pas un gouvernement légitime. Nous aurons besoin d’un soutien extérieur et continuerons à soutenir la vraie France dans notre lutte pour libérer notre pays."
 VIC_form_new_parliament: "Former un nouveau Parlement"
 VIC_form_new_parliament_desc: "Le gouvernement français a été un désastre pour notre pays. Nous devons former un nouveau Parlement pour le remplacer et garantir que le peuple français soit représenté"
 VIC_ministeries: "Un nouveau ministère"
 VIC_ministeries_desc: "Dans notre nouveau parlement, nous devrons former de nouveaux ministères pour assurer la croissance économique et politique."
 VIC_ministeries_first_decision_1: "Le ministère de l'Intérieur"
 VIC_ministeries_first_decision_1_desc: "Le ministère de l'Intérieur est responsable de la sécurité intérieure de l'État, et sera responsable de la police et de la gendarmerie. Il sera également responsable de l'administration du pays."
 VIC_ministeries_first_decision_2: "Le ministère de l'Intérieur"
 VIC_ministeries_first_decision_2_desc: "Le ministère de l'Intérieur est responsable de la sécurité intérieure de l'État, et sera responsable de la police et de la gendarmerie. Il sera également responsable de l'administration du pays."
 VIC_ministeries_first_decision_3: "Le ministère de l'Intérieur"
 VIC_ministeries_first_decision_3_desc: "Le ministère de l'Intérieur est responsable de la sécurité intérieure de l'État, et sera responsable de la police et de la gendarmerie. Il sera également responsable de l'administration du pays."
 VIC_ministeries_second: "Le ministère de la Guerre"
 VIC_ministeries_second_desc: "Le ministère de la Guerre est responsable des affaires militaires de l’État et sera responsable du commandement et du contrôle de nos forces armées."
 VIC_ministeries_second_decision_1: "Le ministère de la Guerre"
 VIC_ministeries_second_decision_1_desc: "Le ministère de la Guerre est responsable des affaires militaires de l’État et sera responsable du commandement et du contrôle de nos forces armées."
 VIC_ministeries_second_decision_2: "Le ministère de la Guerre"
 VIC_ministeries_second_decision_2_desc: "Le ministère de la Guerre est responsable des affaires militaires de l’État et sera responsable du commandement et du contrôle de nos forces armées."
