 france.36.title: "EXPLICATIONS GAMEPLAY FRANCE"
 france.36.desc: "Sur ce mod il est impossible pour le joueur Français de construire en france métropolitaine.\nPour ce faire les cases en france métropolitaine possèdent un énorme malus de construction.\n\nLorsque que vous avez capitulé, votre matos en stock sera transféré à Haïti vous avez une décision pour l'annexer et ainsi récupérer vos stocks.\n\nVous exploitez avec une meilleure industrie qu'en vanille afin de parvenir à bâtir une économie stable dans vos colonies, à partir de mi 36 pendant 3 ans vous aurez +10 militaires qui vont spawn en france métropolitaine chaque année."
 france.36.a: "FAITES HONNEUR À DE GAULLE !"
