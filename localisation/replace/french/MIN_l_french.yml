 VIC_german_trade_concession_desc: "Les Allemands ont proposé de commercer avec nous"
 VIC_open_foreign_subsidized_factories_tt: "une §YCivilian Factory§! sera ajoutée pour chacun des pays suivants qui ont un §Yopinion§! de §YVichy§! supérieur à §G60§! : \n§Y[HUN.GetNameDef]§!, §Y[ROM.GetNameDef]§!, §Y[YUG.GetNameDef]§! et §Y[BUL.GetNameDef]§!."
 VIC_axis_minor_investment: "Investissement mineur de l’Axe"
 VIC_axis_minor_investment_desc: "Les puissances de l’Axe ont réussi à dominer l’économie mondiale grâce à leur expansion agressive et à leur exploitation des ressources. Nous devons prendre des mesures pour garantir que nous ne soyons pas laissés pour compte dans cette lutte mondiale pour la suprématie économique."
