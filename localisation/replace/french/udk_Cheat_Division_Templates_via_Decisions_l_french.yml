 #Infantry: 
 udk_Cheat_Division_Templates_via_Decisions_Infantry_Cheap: "§118W Infanterie§!" #NT!
 udk_Cheat_Division_Templates_via_Decisions_Infantry_Cheap_desc: "Modèle d'infanterie 18W. Division d'infanterie par défaut, doit adapter les compagnies de soutien à vos besoins." #NT!
 udk_Cheat_Division_Templates_via_Decisions_Infantry_Cost_Effective: "§436W Infanterie (rentable)§!" #NT!
 udk_Cheat_Division_Templates_via_Decisions_Infantry_Cost_Effective_desc: "Infanterie 36WRentable. Idéal pour les terrains merdiques et les zones à faible approvisionnement. Doit adapter les entreprises d’accompagnement à vos besoins." #NT!
