 #Garrison Explanation: 
 udk_Cheat_Division_Templates_via_Decisions_Garrison_title: "§YModèles de garnison :§! Passez la souris sur cette décision pour obtenir une explication des modèles de garnison." #NT!
 udk_Cheat_Division_Templates_via_Decisions_Garrison_title_desc: "§Y1-§ ! §WGarrison bon marché (pas rentable) (Cavalerie uniquement, pas de MP) :§!\nModèle (IC) le moins cher pour les professions. Inclut uniquement la cavalerie, aucune police militaire ajoutée pour réduire les coûts IC. Cela nécessitera une énorme quantité de main-d'œuvre et en perdra beaucoup.\n\n§Y2-§! §WGarrison rentable à moyen terme (Cavalerie + MP) :§!\nUn meilleur modèle de garnison, idéal pour les pays mineurs. Même si cela coûte et perd encore beaucoup de main-d'œuvre, la police militaire pourrait éventuellement rendre ce système 50 % plus efficace. Coûte initialement plus d'IC, mais à moyen-long terme, dépassera la version bon marché.\n\n§Y3-§! §WGarrison rentable à long terme (L.Tank) :§!\nMeilleur modèle de garnison, utilisez-le avec le L.Tank le moins cher (Suspension de bogie, Inter-War L.Tank, coûte 2,4 IC), désactivez l'utilisation de nouveaux équipements. Investissement massif en IC au début. Mais en raison de sa dureté de 80 % et de ses exigences minimales en matière de main-d'œuvre, il surpasse les autres modèles en 2 à 3 ans en perdant 5 fois moins de circuits intégrés et de main-d'œuvre. Particulièrement utile pour l'Axe, le Japon ou la Conquête mondiale." #NT!
 #Garrison Templates: 
 udk_Cheat_Division_Templates_via_Decisions_Garrison_Cheap: "§1Garrison bon marché (Cavalerie uniquement)§!" #NT!
 udk_Cheat_Division_Templates_via_Decisions_Garrison_Cheap_desc: "Modèle le moins cher (IC) pour les professions. Inclut uniquement la cavalerie, aucune police militaire ajoutée pour réduire les coûts IC. Cela prendra énormément de main d’œuvre et en perdra beaucoup." #NT!
 udk_Cheat_Division_Templates_via_Decisions_Garrison_Medium_Term_Cost_Effective: "§4Garrison Normal (Cavalerie+MP)§!" #NT!
 udk_Cheat_Division_Templates_via_Decisions_Garrison_Medium_Term_Cost_Effective_desc: "Un meilleur modèle de garnison, idéal pour les pays mineurs. Même si cela coûte et perd encore beaucoup de main-d'œuvre, la police militaire pourrait éventuellement rendre ce système 50 % plus efficace. Au départ, le coût du circuit intégré est plus élevé, mais à moyen et long terme, il dépassera la version bon marché." #NT!
 udk_Cheat_Division_Templates_via_Decisions_Garrison_Long_Term_Cost_Effective: "§8Garrison Pays majeur uniquement (L.Tank)§!" #NT!
 udk_Cheat_Division_Templates_via_Decisions_Garrison_Long_Term_Cost_Effective_desc: "Meilleur modèle de garnison, utilisez-le avec le L.Tank le moins cher (Bogie Suspension, Inter-War L.Tank, coûte 2,4 IC), désactivez l'utilisation de nouveaux équipements. Investissement massif en IC au début. Mais en raison de sa dureté de 80 % et de ses exigences minimales en matière de main-d'œuvre, il surpasse les autres modèles en 2 à 3 ans en perdant 5 fois moins de circuits intégrés et de main-d'œuvre. Particulièrement utile pour l'Axe, le Japon ou la Conquête mondiale." #NT!
  
