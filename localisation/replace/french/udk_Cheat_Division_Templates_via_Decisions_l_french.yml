 udk_Cheat_Division_Templates_via_Decisions_Marines_Expensive_v1_b: "Assaut amphibie 30 W M.Amph.Tank+Mot. Cher v1.b (Rocket)" #NT!
 udk_Cheat_Division_Templates_via_Decisions_Marines_Expensive_v1_b_desc: "Une modification de Expensive v1.a, remplace AT par Rocket Support Artillery." #NT!
  
