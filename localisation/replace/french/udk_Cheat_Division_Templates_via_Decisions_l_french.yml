 udk_Cheat_Division_Templates_via_Decisions_Marines_Super_Expensive_v1_a_desc: "Vraiment cher, utilise un blindage moyen amphibie et de l'infanterie mécanisée, dispose de sociétés de soutien AA, AT, ART, LOG et MAIN. A besoin de plus de ravitaillement, mais démolit toute opposition et peut également être utilisé comme division de chars régulière. Nécessite une grande quantité de MIL." #NT!
  
 udk_Cheat_Division_Templates_via_Decisions_Marines_Super_Expensive_v1_b: "Assaut amphibie 30 W M.Amph.Tank+Mech. Super cher v1.b (Rocket)" #NT!
 udk_Cheat_Division_Templates_via_Decisions_Marines_Super_Expensive_v1_b_desc: "Une modification de Super Expensive v1.a, remplace AT par Rocket Support Artillery." #NT!
  
 udk_Cheat_Division_Templates_via_Decisions_Marines_Super_Expensive_v1_c: "None" #NT!
