 #Mobile Infantry Explanation: 
 udk_Cheat_Division_Templates_via_Decisions_Mobile_title: "§YModèles d'infanterie mobile :§! Passez la souris sur cette décision pour une explication des modèles d'infanterie mobile." #NT!
 udk_Cheat_Division_Templates_via_Decisions_Mobile_title_desc: "Utilisez l'infanterie mobile pour exploiter les percées créées par les divisions blindées.\n\n§Y1-§ ! §W13W Exploit&Déf. Mot. Pas cher :§!\nModèle d'infanterie mobile le moins cher (IC), ne dispose que de 13 largeurs de combat et d'ART, sociétés de support ENG. Cela vaut la peine d'être utilisé uniquement contre une IA faible. Également faible face à la réponse ennemie. Utile uniquement si vous disposez de MIL insuffisants et devez exploiter des avancées.\n\n§Y2-§! §W27W Exploit&Def. Mot. Rentable v1 : §!\nModèle d'infanterie mobile le plus rentable, 27 W +, avec sociétés de support AA, ART, ENG et LOG. Bien qu'il n'ait pas d'AT, il a toujours une bonne plume contre les armures légères et la plupart des armures moyennes.\n\n§Y3-§! §W27W Exploit&Def. Mot. Rentable v2 (Rocket) :§!\nUne mise à niveau de Rentable v1, ajout d'une artillerie de support de fusée.\n\n§Y4-§! §W27W Exploit&Def. Mot. Cher (AT, No Rocket) :§!\nUne modification de Cost Effective v1, ajout d'AT. Utilisez-le si PEN ne suffit pas. Ce modèle n'a pas de version Rocket Support Artillery, tous les emplacements de support sont pleins, utilisez Cost Effective v2, remplace uniquement S.AT par Rocket Support Artillery.\n\n§Y5-§! §W27W Exploit&Def. Mécanique. Super cher v1.a (maintenance) :§!\nVraiment cher, utilise de l'infanterie mécanisée, dispose d'ENG, AA, ART, LOG, MAIN Support Companies. A besoin de plus d’approvisionnement, mais excelle dans son rôle. Nécessite une grande quantité de MIL.\n\n§Y6-§! §W27W Exploit&Def. Mécanique. Super Expensive v1.b (AT) :§!\nUne modification de Super Expensive v1.a, maintenance remplacée par AT.\n\n§Y7-§! §W27W Exploit&Def. Mécanique. Super Expensive v1.c (Rocket) :§!\nUne modification de Super Expensive v1.a, maintenance remplacée par l'artillerie de support de fusée." #NT!
