 udk_Cheat_Division_Templates_via_Decisions_Mobile_Expensive_desc: "Une modification de Cost Effective v1, ajout d'AT. Utilisez-le si PEN ne suffit pas. Ce modèle n'a pas de version Rocket Support Artillery, tous les emplacements de support sont pleins, utilisez Cost Effective v2, remplace uniquement S.AT par Rocket Support Artillery." #NT!
 udk_Cheat_Division_Templates_via_Decisions_Mobile_Super_Expensive_v1_a: "27W Exploit&Déf. Mécanique. Super cher v1.a (maintenance)" #NT!
 udk_Cheat_Division_Templates_via_Decisions_Mobile_Super_Expensive_v1_a_desc: "Vraiment cher, utilise de l'infanterie mécanisée, dispose de sociétés de soutien ENG, AA, ART, LOG et MAIN. A besoin de plus d’approvisionnement, mais excelle dans son rôle. Nécessite une grande quantité de MIL." #NT!
