 udk_Cheat_Division_Templates_via_Decisions_Marines_Cheap_v1_desc: "Le modèle d'assaut amphibie le plus complet (IC), dispose de sociétés de support AA, AT, ART, ENG, LOG. Cela vaut la peine d'être utilisé uniquement contre une IA faible. Cela fera beaucoup de victimes. Également faible face à la réponse ennemie. Mauvaise utilisation de la casquette d'invasion navale." #NT!
