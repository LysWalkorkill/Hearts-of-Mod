 #For Mod named "udkudk Puppet Faction Members" by udkudk. Have Fun! "Membres de la faction des marionnettes udkudk" #NT!
  
 #Decision Category: 
 udk_Cheat_Division_Templates_via_Decisions: "Ajouter des modèles de division via les décisions" #NT!
 udk_Cheat_Division_Templates_via_Decisions_desc: "Vous pouvez ajouter des modèles de division sans visiter le wiki ni dépenser de l'XP militaire.\n\nN'oubliez pas que vos doctrines militaires sont très importantes, il est donc suggéré d'ajuster les modèles selon vos préférences.\n\nVous pouvez facilement modifier les modèles.\n\nIl existe généralement 3 variantes de divisions ;\n--§1Cheap§ !\n--§4Normal§ !\n--§8Expensive§ !\n\nCertaines variantes peuvent dépendre de la rentabilité. utilisation à long terme (telle que la division de garnison L.Tank avec un coût initial élevé en IC, mais à long terme plus de rentabilité en IC et en main d'œuvre.)\n\n§GLes décisions sont répétables après 1 jour.§!\n\n§AVERTISSEMENT :§!\nSi vous n'avez pas la technologie nécessaire pour des unités telles que les Mech ou les Marines, les détails de cette division afficheront tout ce qui concerne cette unité de manière erronée. La recherche de la technologie nécessaire résoudra ce problème. Vous pouvez voir quelle technologie vous manque en survolant le bouton de décision." #NT!
  
