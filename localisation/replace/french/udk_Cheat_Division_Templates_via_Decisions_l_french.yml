 #Armored Assault Explanation: 
 udk_Cheat_Division_Templates_via_Decisions_Armored_title: "§YModèles d'assaut blindé :§! Passez la souris sur cette décision pour une explication des modèles d'assaut blindé." #NT!
 udk_Cheat_Division_Templates_via_Decisions_Armored_title_desc: "Ajustez les modèles pour avoir min 40, max. 50 org. Les tanks sont destinés à des percées rapides, ils n'ont pas besoin d'une ORG élevée.\n\n§Y1-§ ! §W30W 40_ORG Armor Med.Tank Mot. Rentable v1.a (AT) :§!\nModèle d'assaut blindé le plus rentable, avec AA, AT, ART, LOG et MAIN Support Companies. Utilisez-le si votre PEN n'est pas suffisant.\n\n§Y2-§! §W30W 40_ORG Armor Med.Tank Mot. Cost Effective v1.b (Rocket) :§!\nUne modification de Cost Effective v1.a, remplacement de l'AT par une artillerie de support de fusée. Utilisez-le si vous n'avez pas besoin d'AT.\n\n§Y3-§! §W30W 40_ORG Armor Mod.Tank Mot. Rentable v2.a (AT) :§!\nUne mise à niveau de Rentable v1.b, utilise des chars modernes. Utilisez-le si votre PEN n'est pas suffisant.\n\n§Y4-§! §W30W 40_ORG Armor Mod.Tank Mot. Cost Effective v2.b (Rocket) :§!\nUne modification de Cost Effective v2.a, remplacement de l'AT par de l'artillerie de support de fusée. Utilisez-le si vous n'avez pas besoin d'AT.\n\n§Y5-§! §W30W 40_ORG Armor Med.Tank Mech. Cher v1.a (AT) :§!\nVraiment cher, utilise l'infanterie mécanisée, dispose de AA, AT, ART, LOG, MAIN Support Companies. Ultra OP en SP. A besoin de plus d’approvisionnement, mais excelle dans son rôle. Nécessite une grande quantité de MIL. Pas rentable. Utilisez-le si votre PEN n'est pas suffisant.\n\n§Y6-§! §W30W 40_ORG Armor Med.Tank Mech. Cher v1.b (Rocket) :§!\nUne modification de Cher v1.a, remplacé l'AT par de l'artillerie de support de fusée. Utilisez-le si vous n'avez pas besoin d'AT.\n\n§Y7-§! §W30W 40_ORG Armor Mod.Tank Mech. Expensive v2.a (AT) :§!\nUne mise à niveau de Expensive v1.a, utilise des chars modernes. Utilisez-le si votre PEN n'est pas suffisant.\n\n§Y8-§! §W30W 40_ORG Armor Mod.Tank Mech. Cher v2.b (Rocket) :§!\nUne modification de Cher v2.a, remplacé l'AT par de l'artillerie de support de fusée. Utilisez-le si vous n'avez pas besoin d'AT." #NT!
