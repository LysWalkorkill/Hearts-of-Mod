 #Amphibious Assault Explanation: 
 udk_Cheat_Division_Templates_via_Decisions_Marines_title: "§YModèles d'assaut amphibie :§! Passez la souris sur cette décision pour une explication des modèles d'assaut amphibie. 1/2" #NT!
 udk_Cheat_Division_Templates_via_Decisions_Marines_title_desc: "§Y1-§ ! §W10W Amphibious Assault Marines Cheap v1 :§!\nModèle d'assaut amphibie le moins cher (IC), avec sociétés de support AA, AT, ART, ENG, LOG. Cela vaut la peine d'être utilisé uniquement contre une IA faible. Cela fera beaucoup de victimes. Également faible face à la réponse ennemie. Mauvaise utilisation de la casquette d'invasion navale.\n\n§Y2-§! §W10W Amphibious Assault Marines Cheap v2.a (Rocket + AT) :§!\nUne mise à niveau de Cheap v1, remplacement de la logistique par de l'artillerie de soutien de fusée.\n\n§Y3-§! §W10W Amphibious Assault Marines Cheap v2.b (Rocket + Logistique) :§!\nUne modification de Cheap v2.a, remplace AT par Logistics. Utilisez-les si vous ne rencontrez aucun char ennemi mais avez des problèmes d'approvisionnement.\n\n§Y4-§! §W30W Marines d'assaut amphibie + ART rentable v1 :§!\nModèle d'assaut amphibie le plus rentable, avec artillerie de ligne + compagnies de support AA, AT, ART, ENG, LOG. Toujours vulnérable contre les blindés ennemis (chars Med ou Heav). Mais beaucoup plus fort en terrain normal. Faible en multijoueur. Bon dans la plupart des jeux IA. Meilleure utilisation de la casquette d'invasion navale.\n\n§Y5-§! §W30W Marines d'assaut amphibie+ART rentable v2.a (Rocket + AT) :§!\nUne mise à niveau de la version rentable 1, remplacement de la logistique par de l'artillerie de soutien de fusée.\n\n§Y6-§! §W30W Marines d'assaut amphibie+ART rentable v2.b (Rocket + Logistics) :§!\nUne modification de Cost Effective v2.a, remplace AT par Logistics. Utilisez-les si vous ne rencontrez aucun char ennemi mais avez des problèmes d'approvisionnement." #NT!
 udk_Cheat_Division_Templates_via_Decisions_Marines_title_2: "§YModèles d'assaut amphibie :§! Passez la souris sur cette décision pour une explication des modèles d'assaut amphibie. 2/2" #NT!
 udk_Cheat_Division_Templates_via_Decisions_Marines_title_2_desc: "§Y7-§ ! §W30W Assaut amphibie M.Amph.Tank+Mot. Cher v1.a (AT) :§!\nTrès bon modèle d'assaut amphibie, utilise une armure moyenne amphibie et de l'infanterie motorisée, dispose de compagnies de soutien AA, AT, ART, LOG et PRINCIPALES. A besoin de plus de ravitaillement, mais démolit toute opposition et peut également être utilisé comme division de chars régulière.\n\n§Y8-§! §W30W Assaut amphibie M.Amph.Tank+Mot. Cher v1.b (Rocket) :§!\nUne modification de Cher v1.a, remplace l'AT par de l'artillerie de support de fusée.\n\n§Y9-§! §W30W Assaut amphibie M.Amph.Tank+Mech. Super cher v1.a (AT) :§!\nVraiment cher, utilise une armure moyenne amphibie et de l'infanterie mécanisée, dispose de compagnies de soutien AA, AT, ART, LOG et PRINCIPALES. A besoin de plus de ravitaillement, mais démolit toute opposition et peut également être utilisé comme division de chars régulière. Nécessite une grande quantité de MIL.\n\n§Y10-§! §W30W Assaut amphibie M.Amph.Tank+Mech. Super Expensive v1.b (Rocket) :§!\nUne modification de Super Expensive v1.a, remplace AT par Rocket Support Artillery.\n\n§Y11-§! §W30W Amphibious Assault M.Amph.Tank+Amtrac Super Expensive v1.c (AT):§!\nUne modification de Super Expensive v1.a, remplace Mechanized Infanterie avec Amtrac.\n\n§Y12-§! §W30W Assaut amphibie M.Amph.Tank+Amtrac Super Expensive v1.d (Rocket) :§!\nUne modification de Super Expensive v1.c, remplace l'AT par de l'artillerie de support de fusée." #NT!
