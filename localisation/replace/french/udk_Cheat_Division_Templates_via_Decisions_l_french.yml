 #Coast Defense Explanation: 
 udk_Cheat_Division_Templates_via_Decisions_Coast_Defense_title: "§YModèles de défense côtière :§! Passez la souris sur cette décision pour une explication des modèles de défense côtière." #NT!
 udk_Cheat_Division_Templates_via_Decisions_Coast_Defense_title_desc: "§Y1-§ ! §W Défense côtière bon marché §!\nUtilisez simplement une division d'infanterie normale de 18 W\n\n§Y2-§! §W Défense côtière rentable :§!\nUtilisez simplement une division d'infanterie lourde de 36 W. Pourquoi une compagnie de soutien adaptée\n\n§Y3-§! §W 36 W Meca Wall Coast Defense §!\n Meca Wall sont les meilleure façon de défendre votre littoral, mais cela coûte extrêmement cher.\n" #NT!
 #Coast Defense: 
 udk_Cheat_Division_Templates_via_Decisions_Meca_Coast_Defense: "§836W Défense côtière du mur de Meca§!" #NT!
 udk_Cheat_Division_Templates_via_Decisions_Meca_Coast_Defense_desc: "36W Défense côtière Meca. Principalement le but de l'Axe." #NT!
  
