  #focus
  
  KAZ_grande_industrialisation:0 "Great Industrialization"
  KAZ_grande_industrialisation_desc:0 "The Soviet Union has invested enormous resources in developing our industry. We must make their efforts worthwhile."
  KAZ_rapide_industrialisation:0 "Rapid Industrialization"
  KAZ_rapide_industrialisation_desc:0 "We will invest heavily in the industrialization of our country."
  KAZ_grande_extension:0 "Major Expansion"
  KAZ_grande_extension_desc:0 "Thanks to previous investments, we will build thousands of new homes and increase our construction capacity."
  KAZ_exploiter_les_ressources_naturel:0 "Exploit Natural Resources"
  KAZ_exploiter_les_ressources_naturel_desc:0 "By exploiting our country's natural resources, we will be able to increase our industrial capacity."
  KAZ_societe_agriere:0 "Agrarian Society"
  KAZ_societe_agriere_desc:0 "We will not allow ourselves to be influenced by the Soviet Union and its desire to overindustrialize our country."
  KAZ_renover_nos_plaines:0 "Revitalize Our Plains"
  KAZ_renover_nos_plaines_desc:0 "We will exploit the riches of our homeland and reap the benefits."
  KAZ_demander_le_rapatriment_de_nos_troupeaux:0 "Demand the Return of Our Herds"
  KAZ_demander_le_rapatriment_de_nos_troupeaux_desc:0 "With the herds that the Soviet Union took from us in the past, we will be able to restore the strength of our agrarian society."
  KAZ_alocation_d_urgence:0 "Emergency Allocation"
  KAZ_alocation_d_urgence_desc:0 "In the face of global instability, the Soviet Union has allocated us an emergency budget to help us prepare for the future."
  KAZ_notre_politique_dechange:0 "Our Trade Policy"
  KAZ_notre_politique_dechange_desc:0 "We will establish ourselves on the international market to take advantage of free trade for the benefit of our industry."
  KAZ_reveiller_les_industrielle:0 "Awaken the Industrialists"
  KAZ_reveiller_les_industrielle_desc:0 "With the few powerful industrialists operating in our territory, we will establish new production facilities."
  KAZ_Develloper_nos_villes:0 "Develop Our Cities"
  KAZ_Develloper_nos_villes_desc:0 "With our country's industrialization underway, it is time to develop our cities so they can live up to their reputation."
  KAZ_reponse_a_la_destabilisation_mondial:0 "Response to Global Destabilization"
  KAZ_reponse_a_la_destabilisation_mondial_desc:0 "We must invest heavily in arms factories to defend the integrity of our territory."
  KAZ_recherche_kazak:0 "Kazakh Research"
  KAZ_recherche_kazak_desc:0 "Our intellectuals will be able to make greater contributions thanks to newly constructed facilities."
  KAZ_finir_les_routes_de_ravitaillement:0 "Complete the Supply Routes"
  KAZ_finir_les_routes_de_ravitaillement_desc:0 "Given the harsh climatic conditions in our territory, we must invest in infrastructure worthy of the name."
  KAZ_ouvrir_des_usine_de_metalurgie_specialise:0 "Open Specialized Metallurgical Plants"
  KAZ_ouvrir_des_usine_de_metalurgie_specialise_desc:0 "Following our country's rapid industrialization, we need more heavy industry."
  KAZ_Remplir_nos_quotas:0 "Meet Our Quotas"
  KAZ_Remplir_nos_quotas_desc:0 "The Soviet Union is demanding ever more resources for its industry, and we will meet its demands."
  KAZ_Ouvrir_de_nouvelle_usine_de_metalurgie:0 "Open New Metallurgical Plants"
  KAZ_Ouvrir_de_nouvelle_usine_de_metalurgie_desc:0 "With new metallurgical plants, the production of refined resources will become one of the pillars of our economy."
  KAZ_exploiter_le_bassin_karaganda:0 "Exploit the Karaganda Basin"
  KAZ_exploiter_le_bassin_karaganda_desc:0 "The Karaganda Basin is rich in coal, which is why we must invest in this vital resource."
  KAZ_Satisfaire_les_demandes_en_matiere_premiere:0 "Meet Raw Material Demands"
  KAZ_Satisfaire_les_demandes_en_matiere_premiere_desc:0 "As our industry becomes increasingly resource-hungry, we must dig deeper and deeper to meet demand."
  KAZ_installer_notre_industrie_sur_les_mines_dalu_russe:0 "Establish Our Industry Around Russian Aluminum Mines"
  KAZ_installer_notre_industrie_sur_les_mines_dalu_russe_desc:0 "To sustain our aviation industry, we must exploit certain resources in Russia, in exchange for an appropriate payment, of course."
  KAZ_faire_sortir_du_sol_les_mines_duranium:0 "Bring Uranium Deposits to the Surface"
  KAZ_faire_sortir_du_sol_les_mines_duranium_desc:0 "Kazakh soil is rich in uranium. We must take advantage of this to pursue certain projects."
  KAZ_investir_dans_des_nouveaux_chemin_de_fer:0 "Invest in New Railway Lines"
  KAZ_investir_dans_des_nouveaux_chemin_de_fer_desc:0 "Our railway network is underdeveloped. We must therefore invest in its improvement."
  KAZ_se_preparer_a_lavenir:0 "Prepare for the Future"
  KAZ_se_preparer_a_lavenir_desc:0 "Given the global situation, it is time to invest in a proper army."
  KAZ_concentrer_nos_effort_sur_la_terre:0 "Focus Our Efforts on Land"
  KAZ_concentrer_nos_effort_sur_la_terre_desc:0 "Despite recent advances, ground warfare remains the main challenge in any invasion. With this in mind, we must invest in an effective ground army."
  KAZ_rendre_le_service_de_quatre_ans_obligatoire:0 "Make Four Years of Military Service Mandatory"
  KAZ_rendre_le_service_de_quatre_ans_obligatoire_desc:0 "Given our current population, we need a sufficiently long period of military service to meet our army's needs."
  KAZ_la_qualite_sur_la_quantite:0 "Quality Over Quantity"
  KAZ_la_qualite_sur_la_quantite_desc:0 "To stand against a well-equipped army, we must ensure that our troops are even better equipped than the enemy."
  KAZ_demander_la_license_de_okmo:0 "Request an OKMO License"
  KAZ_demander_la_license_de_okmo_desc:0 "We have no tank manufacturing companies in our country. That is why we are requesting access to an OKMO license."
  KAZ_specialise_nos_usines:0 "Specialize Our Factories"
  KAZ_specialise_nos_usines_desc:0 "To enable our country to build an effective army, we will prioritize a mechanized army over one composed entirely of foot soldiers."
  KAZ_ameliorer_le_caburant_des_chars:0 "Improve Tank Fuel"
  KAZ_ameliorer_le_caburant_des_chars_desc:0 "By improving fuel flow, we will optimize the air-fuel mixture."
  KAZ_reduire_la_surchauffe_des_mitrailleuse:0 "Reduce Machine Gun Overheating"
  KAZ_reduire_la_surchauffe_des_mitrailleuse_desc:0 "To allow our tank machine guns to fire for longer, we will change our raw material supplier."
  KAZ_refaire_la_conception:0 "Redesign Our Vehicles"
  KAZ_refaire_la_conception_desc:0 "With a simplified design, our engineers will have less difficulty assembling our armored vehicles."
  KAZ_recruter_en_masse:0 "Mass Recruitment"
  KAZ_recruter_en_masse_desc:0 "Soviet tactics based on numerical superiority will allow us to break our enemies without much difficulty."
  KAZ_effort_sur_les_anti_char:0 "Focus on Anti-Tank Weapons"
  KAZ_effort_sur_les_anti_char_desc:0 "To counter powerful enemy nations, we need excellent anti-tank weapons capable of bringing their advance to an immediate halt."
  KAZ_arme_anti_blitz:0 "Anti-Blitz Weapons"
  KAZ_arme_anti_blitz_desc:0 "Through the mass production of anti-tank weapons, we will be better equipped to sustain combat against enemy armor."
  KAZ_offrir_un_bouclier_de_dca:0 "Provide an Anti-Aircraft Shield"
  KAZ_offrir_un_bouclier_de_dca_desc:0 "To protect our Soviet comrades, we will invest heavily in building anti-aircraft defenses to neutralize enemy close air support."
  KAZ_avancer_nos_doctrine:0 "Advance Our Doctrines"
  KAZ_avancer_nos_doctrine_desc:0 "We must modernize our doctrines, as we have no combat experience."
  KAZ_la_PPSH_kazak:0 "The Kazakh PPSh"
  KAZ_la_PPSH_kazak_desc:0 "With a new close-combat weapon, we will be more effective on the battlefield."
  KAZ_adopter_la_doctrine_sovietique:0 "Adopt the Soviet Doctrine"
  KAZ_adopter_la_doctrine_sovietique_desc:0 "We will bring in several Soviet advisors to improve our army's training and make it more effective in the field."
  KAZ_reorganiser_nos_etats_major:0 "Reorganize Our General Staff"
  KAZ_reorganiser_nos_etats_major_desc:0 "With a more capable general staff, we will be able to react more quickly at the front."
  KAZ_effort_sur_lartillerie:0 "Focus on Artillery"
  KAZ_effort_sur_lartillerie_desc:0 "Our firepower also depends on the strength of our artillery. With this in mind, we will advance research in this field."
  KAZ_concentrer_nos_effort_sur_lair:0 "Focus Our Efforts on the Air"
  KAZ_concentrer_nos_effort_sur_lair_desc:0 "Our air doctrine is practically nonexistent. That is why we will build everything from scratch to show the world what we are capable of."
  KAZ_devancer_nos_allier_le_plus_tot:0 "Outpace Our Allies as Soon as Possible"
  KAZ_devancer_nos_allier_le_plus_tot_desc:0 "We will invest in an aeronautical research center."
  KAZ_revoir_nos_composant_davionique:0 "Review Our Avionics Components"
  KAZ_revoir_nos_composant_davionique_desc:0 "We must design our aircraft from scratch using the resources available to us."
  KAZ_innovation_aerienne:0 "Aerial Innovation"
  KAZ_innovation_aerienne_desc:0 "With the right investments, we will have everything we need to design good aircraft."
  KAZ_recherche_sur_les_bombardier:0 "Bomber Research"
  KAZ_recherche_sur_les_bombardier_desc:0 "Long-range bombing raids against enemy lines could prove to be an effective strategy."
  KAZ_creer_nos_doctrine_de_cas:0 "Develop Our Close Air Support Doctrine"
  KAZ_creer_nos_doctrine_de_cas_desc:0 "In light of the events in Spain, we must draw lessons that we can apply to our own army."
  KAZ_entraine_nos_pilote_corectement:0 "Train Our Pilots Properly"
  KAZ_entraine_nos_pilote_corectement_desc:0 "With properly trained pilots, we should be able to stand up to our toughest enemies."
  KAZ_allonger_la_distance_de_combat:0 "Extend Our Combat Range"
  KAZ_allonger_la_distance_de_combat_desc:0 "As the air combat zone expands, we must adapt."
  KAZ_acheter_la_licence_de_Mikoyan_Gourevitch_mig:0 "Purchase a Mikoyan-Gurevich (MiG) License"
  KAZ_acheter_la_licence_de_Mikoyan_Gourevitch_mig_desc:0 "By purchasing a MiG license, we can invest heavily in aerial warfare without having to worry about designing our own aircraft."
  KAZ_faire_profiter_mig_de_nos_nouvelle_technologie:0 "Share Our New Technologies with MiG"
  KAZ_faire_profiter_mig_de_nos_nouvelle_technologie_desc:0 "We will share our recent discoveries in airborne radar technology with MiG."
  KAZ_importer_un_nouveaux_type_de_bois:0 "Import a New Type of Wood"
  KAZ_importer_un_nouveaux_type_de_bois_desc:0 "With lighter and stronger wood, our aircraft will weigh less."
  KAZ_revoir_nos_coupe_des_helices:0 "Redesign Our Propellers"
  KAZ_revoir_nos_coupe_des_helices_desc:0 "Thanks to a new propeller design, this essential component is now easier to manufacture."
  KAZ_SRR_kaz:0 "Kazakh SSR"
  KAZ_SRR_kaz_desc:0 "Our overlord has granted us a special status within the Union. We must take advantage of it."
  KAZ_un_partenariat_avec_le_diable:0 "A Partnership with the Devil"
  KAZ_un_partenariat_avec_le_diable_desc:0 "It is clear that our ally is far from ideal, but we must safeguard our mutual sovereignty under all circumstances."
  KAZ_le_defenseur_de_nos_droit:0 "The Defender of Our Rights"
  KAZ_le_defenseur_de_nos_droit_desc:0 "With a political leader working for the common good of our peasants, everything should go smoothly."
  KAZ_instaurer_les_ecole_kazak:0 "Establish Kazakh Schools"
  KAZ_instaurer_les_ecole_kazak_desc:0 "With sustained investment, we should be able to reduce illiteracy in our country."
  KAZ_le_komintern:0 "The Comintern"
  KAZ_le_komintern_desc:0 "Our people's struggle must not be confined to our borders; it must spread for the common good of humanity."
  KAZ_publier_la_propagande_sov:0 "Publish Soviet Propaganda"
  KAZ_publier_la_propagande_sov_desc:0 "The Soviet Union recently asked us to publish the propaganda it distributes within its own territory. We should spread it at home as well."
  KAZ_ouvrir_notre_propre_consul:0 "Open Our Own Consulate"
  KAZ_ouvrir_notre_propre_consul_desc:0 "Opening a consulate should help our industrialists and other economic stakeholders coordinate more effectively within our territory."
  KAZ_Aider_notre_partenaire_dans_sa_lutte:0 "Help Our Partner in Its Struggle"
  KAZ_Aider_notre_partenaire_dans_sa_lutte_desc:0 "General Winter is an excellent ally, but he also takes a toll on his own population and other victims. That is why we can share our expertise throughout Soviet territory."
  KAZ_Offrir_un_cadeaux_a_staline:0 "Give Stalin a Gift"
  KAZ_Offrir_un_cadeaux_a_staline_desc:0 "Recently, a shepherd suggested a rather unusual idea: giving Stalin a goat as a sign of friendship. Is this a good idea?"
  KAZ_effectuer_un_investissement_mutuelle:0 "Make a Mutual Investment"
  KAZ_effectuer_un_investissement_mutuelle_desc:0 "We will coordinate with the Soviet Union to make mutually beneficial investments along our borders."
  KAZ_faire_concurence_au_NKVD:0 "Compete with the NKVD"
  KAZ_faire_concurence_au_NKVD_desc:0 "We will establish an intelligence agency that will allow us to compete with the renowned NKVD."
  KAZ_publier_notre_constitution:0 "Publish Our Constitution"
  KAZ_publier_notre_constitution_desc:0 "It is time to turn the page and publish our constitution throughout our territory."
  KAZ_demander_laccee_au_caoutchouc:0 "Request Access to Rubber"
  KAZ_demander_laccee_au_caoutchouc_desc:0 "With the growth of our aviation industry, we must find new sources of supply. And what better place than Leningrad?"
  KAZ_accepter_les_travailleurs_de_lextreme_orient:0 "Welcome Workers from the Far East"
  KAZ_accepter_les_travailleurs_de_lextreme_orient_desc:0 "The Soviet Union is sending us workers from the Far East to keep our factories running for as long as possible."
  KAZ_faire_valoir_notre_droit_de_seconde_puissance_economique_sovietique:0 "Assert Our Status as the Soviet Union's Second-Largest Economic Power"
  KAZ_faire_valoir_notre_droit_de_seconde_puissance_economique_sovietique_desc:0 "It is time to announce to the world that we are not merely a Soviet republic, but a major economic power."
  KAZ_Rapatrier_notre_population:0 "Repatriate Our Population"
  KAZ_Rapatrier_notre_population_desc:0 "We have received permission from the Soviet Union to repatriate our population, scattered across its vast territory."
  KAZ_affirmer_notre_alegeance:0 "Declare Our Allegiance"
  KAZ_affirmer_notre_alegeance_desc:0 "After many years of waiting, our illustrious leader will proclaim himself a socialist patriot."
  KAZ_demander_le_retour_des_terres_de_nos_ancetre:0 "Demand the Return of Our Ancestral Lands"
  KAZ_demander_le_retour_des_terres_de_nos_ancetre_desc:0 "For a long time, we have sought to reunite with our people, including those beyond our current borders."
  KAZ_abuser_de_leurs_confiance:0 "Abuse Their Trust"
  KAZ_abuser_de_leurs_confiance_desc:0 "By repatriating our population, we can finally begin advancing our true pawns toward the east."
  
  #event
  Hearts-of-Mod_KAZ.1.t: "[From.GetName] Requests the Return of Its Lands"
  Hearts-of-Mod_KAZ.1.title:0 "[From.GetName] Requests the Return of Its Lands"
  Hearts-of-Mod_KAZ.1.d: "[From.GetName] has formally requested the transfer of certain claimed territories in order to reunify its population."
  Hearts-of-Mod_KAZ.1.a: "Cooperation must continue on good terms"
  Hearts-of-Mod_KAZ.1.b: "These lands will remain Soviet"
  Hearts-of-Mod_KAZ.2.t: "[From.GetName] Accepts Our Proposal"
  Hearts-of-Mod_KAZ.2.title:0 "[From.GetName] Accepts Our Proposal"
  Hearts-of-Mod_KAZ.2.d: "Thanks to our efforts over all these years, we are finally reunited under our national flag."
  Hearts-of-Mod_KAZ.2.a: "Excellent"
  Hearts-of-Mod_KAZ.3.t: "[From.GetName] Rejects Our Proposal"
  Hearts-of-Mod_KAZ.3.title:0 "[From.GetName] Rejects Our Proposal"
  Hearts-of-Mod_KAZ.3.d: "It is with great shame that [From.GetName] refuses to transfer our lands to us."
  Hearts-of-Mod_KAZ.3.a: "It was in their own interest"
  Hearts-of-Mod_KAZ.4.t: "[From.GetName] Claims Tannu Tuva"
  Hearts-of-Mod_KAZ.4.title:0 "[From.GetName] Claims Tannu Tuva"
  Hearts-of-Mod_KAZ.4.d: "[From.GetName] is asking us to transfer three states in the far east of our territory so that it can reunify with Tannu Tuva."
  Hearts-of-Mod_KAZ.4.a: "Why not"
  Hearts-of-Mod_KAZ.4.b: "Give them an inch, and they'll take a mile"
  Hearts-of-Mod_KAZ.5.t: "[From.GetName] Accepts"
  Hearts-of-Mod_KAZ.5.title:0 "[From.GetName] Accepts"
  Hearts-of-Mod_KAZ.5.d: "We have finally succeeded in reuniting all the territories we have claimed for so many years."
  Hearts-of-Mod_KAZ.5.a: "Thank you"
  Hearts-of-Mod_KAZ.6.t: "[From.GetName] Refuses"
  Hearts-of-Mod_KAZ.6.title:0 "[From.GetName] Refuses"
  Hearts-of-Mod_KAZ.6.d: "It is with great shame that [From.GetName] refuses to transfer our lands to us."
  Hearts-of-Mod_KAZ.6.a: "What a shame"
  Hearts-of-Mod_KAZ.7.t: "Stalin's Gift"
  Hearts-of-Mod_KAZ.7.title:0 "Stalin's Gift"
  Hearts-of-Mod_KAZ.7.d: "In an act of kindness, a Kazakh shepherd gave Stalin a goat in person, with his government's approval. Since then, the animal has been tending to the gardens on Stalin's private estate."
  Hearts-of-Mod_KAZ.7.a: "I shall name her Maria"
  Hearts-of-Mod_KAZ.8.t: "[From.GetName] Requests Access to Leningrad's Strategic Resources"
  Hearts-of-Mod_KAZ.8.title:0 "[From.GetName] Requests Access to Leningrad's Strategic Resources"
  Hearts-of-Mod_KAZ.8.d: "[From.GetName] is asking for access to Leningrad's strategic resources in order to become self-sufficient in domestic fighter production."
  Hearts-of-Mod_KAZ.8.a: "A necessary sacrifice for the greater good"
  Hearts-of-Mod_KAZ.8.b: "Absolutely not"
  Hearts-of-Mod_KAZ.9.t: "[From.GetName] Agrees to Supply Us with Rubber"
  Hearts-of-Mod_KAZ.9.title:0 "[From.GetName] Agrees to Supply Us with Rubber"
  Hearts-of-Mod_KAZ.9.d: "To enable domestic aircraft production, [From.GetName] has agreed to supply us with rubber."
  Hearts-of-Mod_KAZ.9.a: "Thank you"
  Hearts-of-Mod_KAZ.10.t: "[From.GetName] Refuses"
  Hearts-of-Mod_KAZ.10.title:0 "[From.GetName] Refuses"
  Hearts-of-Mod_KAZ.10.d: "Unfortunately, we will not have access to Russian rubber."
  Hearts-of-Mod_KAZ.10.a: "My production..."
  Hearts-of-Mod_KAZ.11.t: "[From.GetName] Requests Access to Aluminum Mines"
  Hearts-of-Mod_KAZ.11.title:0 "[From.GetName] Requests Access to Aluminum Mines"
  Hearts-of-Mod_KAZ.11.d: "[From.GetName] is lagging considerably behind in aircraft production, largely due to a lack of resources. The country is therefore asking for access to some of our mines in exchange for a few factories."
  Hearts-of-Mod_KAZ.11.a: "For the good of the motherland"
  Hearts-of-Mod_KAZ.11.b: "And what else?"
  Hearts-of-Mod_KAZ.12.t: "[From.GetName] Accepts"
  Hearts-of-Mod_KAZ.12.title:0 "[From.GetName] Accepts"
  Hearts-of-Mod_KAZ.12.d: "We can finally gain access to aluminum, though not without a few sacrifices."
  Hearts-of-Mod_KAZ.12.a: "Good"
  Hearts-of-Mod_KAZ.13.t: "[From.GetName] Refuses to Hand Over Aluminum"
  Hearts-of-Mod_KAZ.13.title:0 "[From.GetName] Refuses to Hand Over Aluminum"
  Hearts-of-Mod_KAZ.13.d: "In an act of cowardice, [From.GetName] refuses to let us benefit from the resources of the Urals."
  Hearts-of-Mod_KAZ.13.a: "What a shame"l_english:
