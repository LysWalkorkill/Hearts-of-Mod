l_english:
    # Exploration
    MEX_explorer_temple_maya:0 "Explore a Mayan Temple"
    MEX_explorer_temple_azteque:0 "Explore an Aztec Temple"
    MEX_explorer_temple_inca:0 "Explore an Incan Temple"

    Hearts-of-Mod_MEX_exploration.1.title:0 "Expedition Report"
    Hearts-of-Mod_MEX_exploration.1.desc:0 "A joint team of the Mexican Army and archaeologists recently conducted a new expedition into a previously unknown indigenous temple, hidden deep within a remote and mountainous region. The mission, organized as part of a national historical research program, aims to deepen our understanding of Mexico's pre-Hispanic civilizations.\n\nDespite a few unexpected incidents in the field, particularly when Captain Ramoucho nearly fell into a concealed chamber within the temple, the expedition is considered a resounding success. Researchers hail it as a major breakthrough for Mexico's historical and scientific knowledge, paving the way for promising future explorations."
    Hearts-of-Mod_MEX_exploration.1.a:0 "¡Viva Mexico!"

    # Drug Traffickers
    MEX_sevir_contre_narco_trafiquants:0 "Crack Down on Drug Traffickers"

    Hearts-of-Mod_MEX_narco-trafiquant.1.title:0 "Drug Traffickers Arrested"
    Hearts-of-Mod_MEX_narco-trafiquant.1.desc:0 "As part of a large-scale operation carried out this week, Mexican authorities launched a series of targeted raids against drug trafficking networks operating in the northern regions of the country.\n\nThe operation proceeded under largely controlled conditions. Only one member of the forces involved, Penultimo, was slightly injured during the intervention. Authorities have confirmed that his condition is stable and that the mission can be considered a significant success in the fight against drug trafficking."
    Hearts-of-Mod_MEX_narco-trafiquant.1.a:0 "Another giant leap forward for Mexico!"

