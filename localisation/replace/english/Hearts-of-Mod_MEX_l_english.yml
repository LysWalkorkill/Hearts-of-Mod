    Hearts-of-Mod_MEX_annexion.1.title:0 "A State Joins Mexico"
    Hearts-of-Mod_MEX_annexion.1.desc:0 "The Mexican government has announced the arrival of a new ally from Central America. Without officially revealing its identity, the authorities have confirmed that it is a regional power prepared to stand alongside Mexico in the fight against the Axis forces.\n\nThis diplomatic rapprochement, the result of negotiations conducted with the utmost discretion, demonstrates a shared desire to defend the stability of the continent and counter the growing influence of hostile powers. Representatives of both nations emphasized the importance of this cooperation, which forms part of a shared vision of security and sovereignty."
    Hearts-of-Mod_MEX_annexion.1.a:0 "Together, we are invincible!"