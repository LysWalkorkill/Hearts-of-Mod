 AST_securiser_papouasie: "Take control of Papua" #NT!
 AST_securiser_iles_sonde: "None" #NT!
  
 Hearts-of-Mod_AST_annexion.1.title: "None" #NT!
 Hearts-of-Mod_AST_annexion.1.desc: "In a context of growing tensions in the Pacific region, the Australian government ordered the mobilization of its armed forces in order to take control of an island considered strategic for maritime security.\n\nInitial information indicates that the operation took place without major confrontation. The military presence was established quickly, and measures are already in place to organize the management of the territory under Australian control.\n\nInternational observers are closely monitoring this maneuver, which could have repercussions on the geopolitical balance in the region." #NT!
 Hearts-of-Mod_AST_annexion.1.a: "They will thank us when danger is present!" #NT!
