 AST_legaliser_chercheurs_opales: "Legalize opal seekers" #NT!
 AST_legaliser_forrage_mecanique: "Legalize mechanical drilling" #NT!
  
 Hearts-of-Mod_AST_industrie.1.title: "New legislation" #NT!
 Hearts-of-Mod_AST_industrie.1.desc: "The Australian government recently announced a series of new measures aimed at granting more rights and freedoms to precious stone prospectors, a booming sector in several regions of the country.\n\nOn the ground, several prospectors are welcoming the news with enthusiasm. “We’ve been waiting for this for a long time,” confides one of them. “There’s potential everywhere, you just have to let us work. »\n\nPoliticians, for their part, insist that these changes will be supervised and progressive. They say they want to find a balance between economic development and natural resource management, while supporting workers in the sector." #NT!
 Hearts-of-Mod_AST_industrie.1.a: "The Gold Rush is Australian!" #NT!
  
