     # Étude d'animaux 
 AST_etudier_kangouroux: "Study kangaroos in their natural environment" #NT!
 AST_etudier_requins_blancs: "Studying white sharks following swimming incidents" #NT!
 AST_etudier_rapaces_agressifs: "Studying aggressive desert raptors following an unusual migration" #NT!
  
 Hearts-of-Mod_AST_etude_animaux.1.title: "Study of kangaroos" #NT!
 Hearts-of-Mod_AST_etude_animaux.1.desc: "An astonishing fact, to say the least, was recently reported by an Australian research team: a scientist managed to establish direct contact with a wild kangaroo, going so far as to shake its hand in the heart of its natural habitat. A breakthrough for Australian Science!\n\nWhile this encounter remains fascinating and rare, specialists would like to emphasize an essential point: despite this almost friendly moment, the kangaroo remains above all a wild beast." #NT!
 Hearts-of-Mod_AST_etude_animaux.1.a: "It was probably Skippy!" #NT!
  
 Hearts-of-Mod_AST_etude_animaux.2.title: "Study of white sharks" #NT!
 Hearts-of-Mod_AST_etude_animaux.2.desc: "A team of Australian divers and researchers recently carried out an observation as daring as it was unprecedented: swimming alongside a great white shark in the open sea, without apparent protection, for a duration of 3 minutes and 52 seconds.\n\n“We knew that the risk was real, but these few minutes gave us valuable observations,” explained one of the team members.\nSpecialists emphasize that this type of interaction remains extremely dangerous and must in no case be reproduced without strict scientific supervision." #NT!
 Hearts-of-Mod_AST_etude_animaux.2.a: "Mmmh not to be reproduced..." #NT!
  
 Hearts-of-Mod_AST_etude_animaux.3.title: "Study of aggressive raptors" #NT!
 Hearts-of-Mod_AST_etude_animaux.3.desc: "An extraordinary event, to say the least, is currently shaking up the Australian scientific community. During an expedition to an isolated region, a researcher managed – or rather dared – to grab onto the claws of a huge raptor, finding himself briefly lifted off the ground for a few seconds.\n\n“It was as impressive as it was worrying,” a member of the team reportedly confided. “We clearly saw the power of the animal. »" #NT!
 Hearts-of-Mod_AST_etude_animaux.3.a: "Fly away Stanley! Be free!" #NT!
  
