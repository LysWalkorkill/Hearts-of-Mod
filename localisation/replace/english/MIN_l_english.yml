VIC_contact_support: "Contact Support"
VIC_contact_support_desc: "The Vichy government is not a legitimate government. We will need external support, and will continue to support the true france in our struggle to liberate our country."
VIC_form_new_parliament: "Form New Parliament"
VIC_form_new_parliament_desc: "The French government has been a disaster for our country. We must form a new parliament to replace it, and ensure that the people of France are represented"
VIC_ministeries: "A new ministry"
VIC_ministeries_desc: "In our new parliament, we will need to form new ministries to ensure economical and political growth."
VIC_ministeries_first_decision_1: "The Ministry of the Interior"
VIC_ministeries_first_decision_1_desc: "The Ministry of the Interior is responsible for the internal security of the state, and will be responsible for the police and the gendarmerie. It will also be responsible for the administration of the country."
VIC_ministeries_first_decision_2: "The Ministry of the Interior"
VIC_ministeries_first_decision_2_desc: "The Ministry of the Interior is responsible for the internal security of the state, and will be responsible for the police and the gendarmerie. It will also be responsible for the administration of the country."
VIC_ministeries_first_decision_3: "The Ministry of the Interior"
VIC_ministeries_first_decision_3_desc: "The Ministry of the Interior is responsible for the internal security of the state, and will be responsible for the police and the gendarmerie. It will also be responsible for the administration of the country."
VIC_ministeries_second: "The Ministry of War"
VIC_ministeries_second_desc: "The Ministry of War is responsible for the military affairs of the state, and will be responsible for the command and control of our armed forces."
VIC_ministeries_second_decision_1: "The Ministry of War"
VIC_ministeries_second_decision_1_desc: "The Ministry of War is responsible for the military affairs of the state, and will be responsible for the command and control of our armed forces."
VIC_ministeries_second_decision_2: "The Ministry of War"
VIC_ministeries_second_decision_2_desc: "The Ministry of War is responsible for  the military affairs of the state, and will be responsible for the command and control of our armed forces."
VIC_ministeries_second_decision_3: "The Ministry of War"
VIC_ministeries_second_decision_3_desc: "The Ministry of War is responsible for the military affairs of the state, and will be responsible for the command and control of our armed forces."
VIC_ministeries_third: "The Ministry of Finance"
VIC_ministeries_third_desc: "The Ministry of Finance is responsible for the financial affairs of the state, and will be responsible for the collection of taxes and the management of the state budget."
VIC_ministeries_third_decision_1: "The Ministry of Finance"
VIC_ministeries_third_decision_1_desc: "The Ministry of Finance is responsible for the financial affairs of the state, and will be responsible for the collection of taxes and the management of the state budget."
VIC_ministeries_third_decision_2: "The Ministry of Finance"
VIC_ministeries_third_decision_2_desc: "The Ministry of Finance is responsible for the financial affairs of the state, and will be responsible for the collection of taxes and the management of the state budget."
VIC_ministeries_third_decision_3: "The Ministry of Finance"
VIC_ministeries_third_decision_3_desc: "The Ministry of Finance is responsible for the financial affairs of the state, and will be responsible for the collection of taxes and the management of the state budget."
VIC_complet_cabinet: "Complete Cabinet"
VIC_complet_cabinet_desc: "The cabinet is now complete, and the government is ready to take on the challenges that lie ahead. We will work tirelessly to ensure the prosperity and security of our nation, and to restore the honor and dignity of France."  
VIC_war_department: "War Department"
VIC_war_department_desc: "The War Department is responsible for the defense of the nation, and will be responsible for the command and control of our armed forces. It will also be responsible for the administration of the military, and will work closely with the Ministry of the Interior to ensure the security of the state."
VIC_economical_department: "Economical Department"
VIC_economical_department_desc: "The Economical Department is responsible for the economic affairs of  the state, and will be responsible for the collection of taxes and the management of the state budget. It will also be responsible for the administration of the economy, and will work closely with the Ministry of Finance to ensure the prosperity of the nation."     
VIC_axis_economic_domination: "Axis Economic Domination"
VIC_axis_economic_domination_desc: "Germany will help us build a stronger nation but we will become their Reichsprotectorate if france would fall"
VIC_axis_economic_domination_tt: "§YGermany§! will help us build a stronger nation but we will become their §YReichsprotectorate§! if france would fall"
VIC_scrap_factories: "scrap factories"
VIC_scrap_factories_desc: "As the war rages, we must work with less and less resources every days"
VIC_spanish_investment: "spanish investment"
VIC_spanish_investment_desc: "By investing in Spain, we can strengthen our economic ties and gain access to valuable resources and industrial support."
VIC_finish_investment: "finish investment"
VIC_finish_investment_desc: "By investing in Finland, we can strengthen our economic ties and gain access to valuable resources and industrial support."
VIC_begin_reconstruction: "begin reconstruction"
VIC_begin_reconstruction_desc: "We will begin rebuilding our shattered infrastructure and industrial base to restore the strength of the nation."
VIC_the_great_investment: "the great investment"
VIC_the_great_investment_desc: "A major investment in our economy that will yield significant returns and strengthen our position in the global market."
VIC_the_great_investment_tt: "for each §Ystate with four§! or more §YInfrastructure§!, we will gain §Yone additional civilian factories§!"
VIC_trad_bonus: "Trade Bonus"
VIC_trad_bonus_desc: "The trade bonus will provide us with additional resources and income, allowing us to invest in our economy and strengthen our position in the global market."
VIC_sovereign_economy: "Sovereign Economy"
VIC_sovereign_economy_desc: "A sovereign economy is one that is self-sufficient and independent, able to withstand external pressures and maintain stability in the face of global economic fluctuations." 
VIC_tungsten_mining: "Tungsten Mining"     
VIC_tungsten_mining_desc: "Tungsten is a critical resource for the production of advanced weaponry and industrial machinery. By investing in tungsten mining, we can secure a vital supply of this strategic material and enhance our industrial capabilities."
VIC_europe_first_producer: "Europe's First Producer"
VIC_europe_first_producer_desc: "By becoming Europe's leading producer of key resources and industrial goods, we can establish a dominant position in the continental economy and ensure our long-term prosperity."
VIC_stable_economy: "Stable Economy"
VIC_stable_economy_desc: "A stable economy is essential for the well-being of our nation, providing a solid foundation for growth, investment, and the ability to respond effectively to both domestic and international challenges."
VIC_call_for_vonlunters: "Call for vonlunters" 
VIC_call_for_vonlunters_desc: "There are plenty of french people ready to join our cause against our corrupt Republican government. We will call upon them to join us in our struggle for a new France."
VIC_la_grande_armee: "La Grande Armée"
VIC_la_grande_armee_desc: "The French army has a long and storied history, and we will work to restore its strength and effectiveness. By modernizing our forces and implementing new strategies, we will ensure that La Grande Armée is prepared to defend our nation and uphold our values"
VIC_industrial_rebirth: "Industrial Rebirth"
VIC_industrial_rebirth_desc: "The industrial sector of our nation has suffered greatly under the current regime. We will invest in revitalizing our industries, promoting innovation, and creating jobs to strengthen our economy and improve the lives of our citizens."
VIC_research_expansion: "Research Expansion"
VIC_research_expansion_desc: "To remain competitive in the modern world, we must invest in research and development. By expanding our research capabilities, we can foster innovation, develop new technologies, and ensure that our nation remains at the forefront of scientific and industrial progress."
VIC_research_expansion_2: "Research Expansion II"
VIC_research_expansion_2_desc: "The expansion of our research capabilities will allow us to explore new frontiers in science and technology, driving economic growth and enhancing our national security. We will prioritize research in key areas to maintain our competitive edge and secure a prosperous future for our nation."    
VIC_research_expansion_3: "Research Expansion III"
VIC_research_expansion_3_desc: "Continuing our research efforts, we will push the boundaries of scientific knowledge and technological innovation. This will further strengthen our national capabilities and ensure our long-term prosperity."
VIC_research_expansion_4: "Research Expansion IV"
VIC_research_expansion_4_desc: "By investing in cutting-edge research and fostering collaboration between our scientists and engineers, we will drive advancements that will benefit our economy, military, and society as a whole. Our commitment to research will secure our nation's place as a leader in the global arena
VIC_political_support: "Political Support"
VIC_political_support_desc: "To achieve our goals, we must build a strong base of political support. By engaging with our citizens, promoting our vision, and fostering unity, we will ensure that our government has the mandate to implement the necessary reforms and policies for the betterment of our nation
VIC_Overseas_factory: "Overseas Factory"
VIC_Overseas_factory_desc: "By establishing factories in our overseas territories, we can take advantage of local resources and labor, boosting our industrial output and creating economic opportunities in these regions.
VIC_ten_hours_shift: "Ten Hours Shift"
VIC_ten_hours_shift_desc: "By implementing a ten-hour work shift, we can increase productivity and efficiency in our factories, while also ensuring that our workers have a balanced work-life schedule.
VIC_twelve_hours_shift: "Twelve Hours Shift"
VIC_twelve_hours_shift_desc: "By implementing a twelve-hour work shift, we can further increase our industrial output and meet the growing demands of our economy, while also providing our workers with fair compensation and benefits for their extended hours."
VIC_national_resurgency: "National Resurgency"
VIC_national_resurgency_desc: "The French nation has faced many challenges throughout its history, but we are committed to a national resurgence that will restore our pride, strength, and influence on the world stage. Through unity, determination, and strategic planning, we will overcome adversity and secure a  bright future for our country." 
 ## END VICHY

