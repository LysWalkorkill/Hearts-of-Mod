germany.129.t: "CITOYENS DU REICH"
germany.129.d: "Le destin de notre peuple nous appelle aujourd'hui à réparer une injustice de l'histoire. Les Allemands d'Autriche et ceux du Reich ne forment qu'un seul peuple, uni par une même langue, une même culture et une même volonté. Cette réunification est présentée comme l'expression naturelle de notre unité nationale."
germany.129.a: "VIVE L'UNITÉ DE NOTRE PEUPLE !"
germany.130.t: "CITOYENS DU REICH"
germany.130.d: "Nos regards se tournent aujourd'hui vers les Allemands des Sudètes, que le gouvernement affirme vouloir protéger. Selon le discours officiel, ces populations auraient été privées de leurs droits et de leur place au sein de la nation allemande."
germany.130.a: "LES ACCORDS DE MUNICH"
germany.131.t: "CITOYENS DU REICH"
germany.131.d: "Le gouvernement du Reich prend acte de la décision rendue à Vienne concernant les territoires contestés entre la Hongrie et la Tchécoslovaquie."
germany.131.a: "LES ACCORDS DE VIENNE"
germany.132.t: "CITOYENS DU REICH"
germany.132.d: "Les événements de ces derniers jours marquent un tournant décisif en Europe. Les troupes allemandes sont entrées en Bohême et en Moravie, mettant fin à l'existence de la Tchécoslovaquie telle qu'elle avait été constituée après la Première Guerre mondiale."
germany.132.a: "TRIOMPHE INÉVITABLE"
germany.133.t: "CITOYENS DU REICH"
germany.133.d: "Le Führer l'avait promis : aucun Allemand ne sera laissé pour compte en Europe. Après l'Autriche, après les Sudètes, le retour du territoire de Memel au sein du Grand Reich allemand est la preuve éclatante que l'ère de l'humiliation de notre peuple est révolue. Ce n'est pas un acte d'agression, c'est un acte de justice naturelle. Nous ne faisons que reprendre ce qui a été construit par la sueur, le travail et le génie de nos ancêtres."
germany.133.a: "HEIL AU FÜHRER ! HEIL À NOTRE PATRIE RETROUVÉE"