#Decision Category:
udk_Cheat_Division_Templates_via_Decisions: "Add Division Templates via Decisions"
udk_Cheat_Division_Templates_via_Decisions_desc: "You can add Division Templates without visiting wiki or spending Army XP.\n\nDon't forget that your Army Doctrines matter a lot, so it's suggested to adjust templates to your preferances.\n\nYou can easily modify templates.\n\nThere's usually 3 variants of Divisions;\n--§1Cheap§!\n--§4Normal§!\n--§8Expensive§!\n\nSome variants cost effectiveness could depend on long term usage (such as L.Tank Garrison Division with High initial IC cost, but long term more IC and Manpower cost effectiveness.)\n\n§GDecisions are repeatable after 1 day.§!\n\n§RWARNING:§!\nIf you don't have necessary technology for Units such as Mech or Marines, That Division's details will show everything related to that unit wrong. Researching necessary tech will fix this.You can see which tech you missing via hovering the decision button."

