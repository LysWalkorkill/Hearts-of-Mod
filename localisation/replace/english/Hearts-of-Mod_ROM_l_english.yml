    Hearts-of-Mod_ROM_industrie.1.title:0 "Industrialization progress"
    Hearts-of-Mod_ROM_industrie.1.desc:0 "Romania has just taken a significant new step in its ambitious industrialization program, confirming its will to rapidly modernize its economy.\n\n« We are moving forward with determination », declared a government representative. « Each step taken brings us closer to a stronger and more independent future. »\n\nObservers also note an improvement in production conditions and a rise in workers' skills, essential elements to support this rapid growth."
    Hearts-of-Mod_ROM_industrie.1.a:0 "This is only the beginning!"

    Hearts-of-Mod_ROM_industrie.2.title:0 "Industrial program completed"
    Hearts-of-Mod_ROM_industrie.2.desc:0 "In an announcement that is causing a stir across Europe, Romania has officially declared that it has completed the final phase of its industrialization program… 15 years ahead of the initial schedule.\n\n« It is they who carried this project, day after day », declared a government representative. « Their courage, endurance and determination have made possible what seemed impossible. »\n\nIn public opinion, a feeling of national pride is felt, many considering that Romanian workers have shown exceptional bravery in the face of the challenges encountered."
    Hearts-of-Mod_ROM_industrie.2.a:0 "Romania has lived up to the challenge!!"

    ROM_enqueter_affaire_dracula:0 "Investigate the Dracula affair"

    Hearts-of-Mod_ROM_dracula.1.title:0 "The Dracula affair"
    Hearts-of-Mod_ROM_dracula.1.desc:0 "A rather strange testimony is currently stirring a small region of Transylvania. An inhabitant claims to have crossed, in the middle of the night, a silhouette that he identifies as the legendary Dracula, in the ruins of an old castle.\n\nIn an excerpt from his interview, he recounts:\n« I swear to you… there was someone up there. Not like the rest of us. He moved without a sound, and his eyes… I saw them shine in the dark. I felt a cold all of a sudden, as if the air had frozen around me. »"
    Hearts-of-Mod_ROM_dracula.1.a:0 "The investigation continues..."
