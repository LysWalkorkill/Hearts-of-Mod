    SAF_amenager_territoire:0 "Continue developing South African territory"
    Hearts-of-Mod_SAF_amenagement.1.title:0 "Territorial Development"
    Hearts-of-Mod_SAF_amenagement.1.desc:0 "The South African government is actively continuing its territorial development projects, with the aim of modernizing infrastructure and better exploiting the country's natural resources.\n\nHowever, this rapid expansion is also raising concerns. Some experts and observers warn of long-term ecological consequences, including soil degradation, the disappearance of certain species, and the disruption of natural balances.\n\nA resident of the affected region shares his feelings:\n“Sure, it brings work and development… but we also see the land changing. The landscapes aren't the same anymore, and we wonder how far this will go.”"
    Hearts-of-Mod_SAF_amenagement.1.a:0 "This development was necessary..."