l_english:
    ## changement armor ##
    cannon_high_velocity_1: "High-Velocity Cannons"
    cannon_high_velocity_1_desc: "By increasing the velocity of our shells, we can increase their armor penetration and range, making them more effective against enemy ships."
    cannon_high_velocity_2: "Improved High-Velocity Cannons"
    cannon_high_velocity_2_desc: "Further improvements in  the design of our high-velocity cannons have allowed us to increase their effectiveness even further, making them a formidable weapon against enemy ships."
    cannon_high_velocity_3: "Advanced High-Velocity Cannons"
    cannon_high_velocity_3_desc: "The latest advancements in high-velocity cannon technology have resulted in a significant boost to their performance, making them an indispensable asset in naval combat."
    cannon_lourd_1: "Heavy Cannons"
    cannon_lourd_1_desc: "By increasing the size and weight of our cannons, we can increase the size of the shells they fire, allowing for greater damage against enemy ships."
    cannon_lourd_2: "Improved Heavy Cannons"
    cannon_lourd_2_desc: "Further improvements in the design of our heavy cannons have allowed us to increase their effectiveness even further, making them a formidable weapon against enemy ships."
    cannon_lourd_3: "Advanced Heavy Cannons"
    cannon_lourd_3_desc: "The latest advancements in heavy cannon technology have resulted in a significant boost to their performance, making them an indispensable asset in naval combat." 
    cannon_medium_1: "Medium Cannons"
    cannon_medium_1_desc: "By increasing the size and weight of our medium cannons, we can increase the size of the shells they fire, allowing for greater damage against enemy ships."
    cannon_medium_2: "Improved Medium Cannons"
    cannon_medium_2_desc: "Further improvements in the design of our medium cannons have allowed us to increase their effectiveness even further, making them a formidable weapon against enemy ships."
    cannon_auto_1: "Automatic Cannons"
    cannon_auto_1_desc: "By automating the loading and firing of our cannons,  we can increase their rate of fire, allowing for greater damage against enemy ships."
    cannon_auto_2: "Improved Automatic Cannons"
    cannon_auto_2_desc: "Further improvements in the design of our automatic cannons have allowed us to increase their effectiveness even further, making them a formidable weapon against enemy ships."
    cannon_small_2: "Improved Small Cannons"
    cannon_small_2_desc: "Further improvements in the design of our small cannons have allowed us to increase their effectiveness even further, making them a formidable weapon against enemy ships."
    cannon_support_gun: "Support Guns"
    cannon_support_gun_desc: "Support guns are designed to provide additional firepower to our main battery of cannons, allowing us to engage multiple targets simultaneously and increase our overall combat effectiveness."  
    cannon_howitzer_1: "Howitzers"
    cannon_howitzer_1_desc: "Howitzers are designed to provide indirect fire support to our main battery of cannons, allowing us to engage targets that are not in direct line of sight and increase our overall combat effectiveness."
    cannon_howitzer_2: "Improved Howitzers"
    cannon_howitzer_2_desc: "Further improvements in the design of our howitzers have allowed us to increase their effectiveness even further, making them a formidable weapon against enemy ships." 
    cannon_aa_1: "Anti-Aircraft Guns"
    cannon_aa_1_desc: "Anti-Aircraft guns are designed to provide additional firepower to our main battery of cannons, allowing us to engage enemy aircraft and increase our overall combat effectiveness    ."
    cannon_aa_2: "Improved Anti-Aircraft Guns"
    cannon_aa_2_desc: "Further improvements in the design of our anti-aircraft guns have allowed us to increase their effectiveness even further, making them a formidable weapon against enemy aircraft."   
    cannon_aa_3: "Advanced Anti-Aircraft Guns"
    cannon_aa_3_desc: "The latest advancements in anti-aircraft gun technology have resulted in a significant boost to their performance, making them an indispensable asset in defending against enemy aircraft."   


