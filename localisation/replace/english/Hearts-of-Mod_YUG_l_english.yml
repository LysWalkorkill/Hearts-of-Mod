    YUG_continuer_grande_yougoslavie:0 "Continue the Greater Yugoslavia project"
    Hearts-of-Mod_YUG_industrie.1.title:0 "Progress of Greater Yugoslavia"
    Hearts-of-Mod_YUG_industrie.1.desc:0 "The ambitious “Greater Yugoslavia” project continues to advance at a sustained pace, and the authorities have just announced that a new major milestone has been reached in its development.\n\nBut beyond material achievements, it is above all the workers' commitment that is highlighted by the project's leaders. According to several accounts, the workers now agree to continue their efforts even under difficult conditions, not hesitating to work in the rain to meet deadlines.\n\nEven more striking, some are said to have agreed to give up personal rights, such as paternity leave, in the name of national interest and the project's success.\n“We do it for the country,” confides a worker. “It's not easy every day, but we know why we're here.”"
    Hearts-of-Mod_YUG_industrie.1.a:0 "Yugoslavia will not disappoint..."